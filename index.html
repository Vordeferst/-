<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e14">
<title>Grenade Arena v0.1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display:block; }

  #mainMenu {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(6, 8, 12, 0.72);
    -webkit-backdrop-filter: blur(10px) saturate(0.6);
    backdrop-filter: blur(10px) saturate(0.6);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity .5s;
    padding: 20px;
  }
  #mainMenu.hidden { opacity: 0; pointer-events: none; }
  .mm-content { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 440px; }
  .mm-title { font-size: clamp(30px, 7.5vw, 58px); font-weight: 900; letter-spacing: 8px; color: #f0f0f0; text-align: center; line-height: 1; margin-bottom: 10px; text-shadow: 0 4px 32px rgba(0,0,0,.95), 0 0 50px rgba(255,140,40,.15); }
  .mm-subtitle { color: rgba(255,255,255,.4); font-size: 11px; letter-spacing: 5px; margin-bottom: 6px; text-align: center; text-transform: uppercase; font-weight: 700; }
  .mm-version { color: rgba(255,255,255,.22); font-size: 10px; letter-spacing: 4px; margin-bottom: 40px; font-family: monospace; }
  .mm-nick { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 26px; width: min(300px, 82vw); }
  .mm-nick label { font-size: 10px; letter-spacing: 4px; color: rgba(255,255,255,.45); font-weight: 800; }
  .mm-nick input { width: 100%; height: 50px; background: rgba(0,0,0,.55); border: 1.5px solid rgba(255,255,255,.12); border-radius: 10px; color: #fff; font-size: 15px; font-weight: 700; text-align: center; outline: none; padding: 0 16px; transition: all .18s; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .mm-nick input:focus { border-color: rgba(255,176,74,.7); background: rgba(0,0,0,.7); box-shadow: 0 0 24px rgba(255,176,74,.25); }
  .mm-nick input::placeholder { color: rgba(255,255,255,.25); }
  #playBtn { width: min(300px, 82vw); height: 66px; border: none; border-radius: 12px; background: linear-gradient(180deg, #e8b354, #b83a18); color: #fff; font-size: 20px; font-weight: 900; letter-spacing: 6px; cursor: pointer; box-shadow: 0 8px 32px rgba(184,58,24,.55), inset 0 2px 0 rgba(255,255,255,.25), inset 0 -3px 8px rgba(0,0,0,.25); transition: all .15s; text-shadow: 0 2px 6px rgba(0,0,0,.4); }
  #playBtn:hover { transform: translateY(-1px); box-shadow: 0 12px 40px rgba(184,58,24,.7), inset 0 2px 0 rgba(255,255,255,.25); }
  #playBtn:active { transform: translateY(0) scale(.98); }
  #soloBtn { margin-top: 12px; width: min(300px, 82vw); height: 46px; background: rgba(255,255,255,.04); border: 1.5px solid rgba(255,255,255,.18); border-radius: 10px; color: rgba(255,255,255,.7); font-size: 12px; font-weight: 800; letter-spacing: 4px; cursor: pointer; transition: all .15s; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  #soloBtn:hover { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.35); color: #fff; }
  #soloBtn:active { transform: scale(.98); }
  .mm-footer { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,.22); font-size: 10px; letter-spacing: 3px; text-align: center; font-family: monospace; pointer-events: none; }

  body:not(.game-started) #hpPanel,
  body:not(.game-started) #ammoPanel,
  body:not(.game-started) #weaponBar,
  body:not(.game-started) #crosshair,
  body:not(.game-started) #pcHint,
  body:not(.game-started) #statPanel,
  body:not(.game-started) #matchTimer,
  body:not(.game-started) #tabBtn,
  body:not(.game-started) #exitBtn,
  body:not(.game-started) #cdBar,
  body:not(.game-started) #fuseTimer,
  body:not(.game-started) #hitmarker,
  body:not(.game-started) #damageFlash,
  body:not(.game-started) #flash,
  body:not(.game-started) #spectatorInfo,
  body:not(.game-started) #deathPanel,
  body:not(.game-started) #killFeed,
  body:not(.game-started) #playerListOverlay,
  body:not(.game-started) #playerList,
  body:not(.game-started) #joyBase,
  body:not(.game-started) #exitModal,
  body:not(.game-started) #matchOverModal { display: none !important; }

  #statPanel { position: fixed; top: 16px; right: 16px; display: none; gap: 8px; align-items: center; background: linear-gradient(180deg, rgba(10,14,20,.85), rgba(5,8,12,.9)); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; padding: 6px 12px; z-index: 25; font-family: monospace; font-size: 12px; font-weight: 700; color: #fff; backdrop-filter: blur(6px); pointer-events: none; }
  #statPanel.visible { display: flex; }
  #fpsText { color: #6fdf6f; } #fpsText.mid { color: #ffb04a; } #fpsText.low { color: #ff6b6b; }
  .stat-divider { color: rgba(255,255,255,.3); }
  #matchTimer { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: linear-gradient(180deg, rgba(10,14,20,.9), rgba(5,8,12,.92)); border: 2px solid rgba(255,176,74,.5); border-radius: 10px; padding: 6px 22px; z-index: 26; font-family: 'Arial Black', sans-serif; font-size: 24px; font-weight: 900; color: #ffd166; letter-spacing: 2px; text-shadow: 0 0 12px rgba(255,209,102,.5); display: none; min-width: 110px; text-align: center; pointer-events: none; }
  #matchTimer.visible { display: block; }
  #matchTimer.danger { color: #ff4444; border-color: #ff4444; animation: timerPulse .5s infinite; }
  #matchTimer.solo { border-color: rgba(126,200,255,.6); color: #7ec8ff; text-shadow: 0 0 12px rgba(126,200,255,.5); }
  @keyframes timerPulse { 50% { transform: translateX(-50%) scale(1.06); } }
  #killFeed { position: fixed; top: 66px; right: 16px; width: 320px; display: flex; flex-direction: column; gap: 5px; z-index: 22; pointer-events: none; }
  .kf-item { background: linear-gradient(90deg, rgba(10,14,20,.94) 0%, rgba(10,14,20,.75) 100%); border-left: 3px solid #ffb04a; padding: 8px 12px; border-radius: 4px; color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(8px); animation: kfIn .25s ease-out; transition: opacity .4s; overflow: hidden; white-space: nowrap; }
  .kf-item.fade { opacity: 0; }
  .kf-killer { color: #7ec8ff; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
  .kf-victim { color: #ff8888; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
  .kf-self { color: #ffd166; font-weight: 900; }
  .kf-kill { color: #ff6666; font-weight: 900; font-size: 14px; }
  @keyframes kfIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  #tabBtn { position: fixed; top: 16px; left: 16px; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(180deg, rgba(50,80,120,.9), rgba(20,40,80,.95)); border: 2px solid rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center; z-index: 24; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  #tabBtn svg { width: 30px; height: 30px; pointer-events: none; }
  #tabBadge { position: absolute; top: -4px; right: -4px; min-width: 22px; height: 22px; border-radius: 11px; background: #ff6b35; color: #fff; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center; padding: 0 6px; pointer-events: none; }
  #exitBtn { position: fixed; top: 16px; left: 84px; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(180deg, rgba(200,60,60,.92), rgba(120,20,20,.95)); border: 2px solid rgba(255,255,255,.4); display: flex; align-items: center; justify-content: center; z-index: 24; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  #exitBtn svg { width: 28px; height: 28px; pointer-events: none; }
  #playerListOverlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(4px); z-index: 39; display: none; pointer-events: none; }
  #playerListOverlay.visible { display: block; }
  #playerList { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(380px, 85vw); background: linear-gradient(180deg, rgba(10,14,20,.97), rgba(5,8,12,.98)); border: 2px solid rgba(255,176,74,.45); border-radius: 14px; padding: 16px 18px; z-index: 40; display: none; max-height: 70vh; overflow-y: auto; }
  #playerList.visible { display: block; }
  #playerList .pl-header { font-size: 12px; letter-spacing: 4px; color: rgba(255,255,255,.65); font-weight: 900; margin-bottom: 12px; text-align: center; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,.12); }
  .pl-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-radius: 8px; margin-bottom: 5px; font-size: 14px; font-weight: 700; color: #fff; background: rgba(255,255,255,.03); }
  .pl-row.pl-self { background: rgba(80,140,220,.2); color: #7ec8ff; }
  .pl-row.pl-dead { opacity: .5; }
  .pl-row .pl-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-row .pl-status { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: 10px; font-size: 11px; }
  .pl-row.pl-self .pl-status { color: #ffd166; letter-spacing: 1px; }
  #joyBase { position: fixed; left: 30px; bottom: 110px; width: 132px; height: 132px; border-radius: 50%; border: 2px solid rgba(255,255,255,.28); background: rgba(255,255,255,.05); pointer-events: none; opacity: 0; z-index: 5; }
  #joyBase.active { opacity: 1; }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.75), rgba(255,255,255,.25)); border: 2px solid rgba(255,255,255,.7); transform: translate(-50%, -50%); }
  #weaponBar { position: fixed; top: 50%; right: 20px; transform: translateY(-50%); display: flex; flex-direction: column; gap: 24px; z-index: 15; pointer-events: none; }
  .wslot { position: relative; width: 96px; height: 54px; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; }
  .wslot .wicon { width: 88px; height: 46px; display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,.9)); transition: filter .18s, transform .18s; }
  .wslot.active .wicon { filter: drop-shadow(0 0 10px rgba(255,180,60,.85)) drop-shadow(0 2px 4px rgba(0,0,0,.9)); transform: scale(1.08); }
  .wslot .wkey { position: absolute; top: -6px; left: -6px; width: 20px; height: 20px; background: rgba(20,28,38,.9); border: 1px solid rgba(255,255,255,.22); border-radius: 4px; font-size: 11px; font-weight: 900; color: rgba(255,255,255,.65); display: flex; align-items: center; justify-content: center; font-family: 'Arial Black', sans-serif; }
  .wslot.active .wkey { background: rgba(255,176,74,.95); color: #000; }
  .wslot .wname { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); font-size: 8px; letter-spacing: 1.2px; color: rgba(255,255,255,.45); font-weight: 700; white-space: nowrap; pointer-events: none; font-family: 'Arial Black', sans-serif; }
  .wslot.active .wname { color: rgba(255,220,150,.95); }
  .wslot.disabled { opacity: 0.35; }
  #hpPanel { position: fixed; left: 16px; bottom: 16px; background: linear-gradient(180deg, rgba(18,24,32,.92), rgba(8,12,18,.94)); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 10px 16px; z-index: 15; min-width: 160px; pointer-events: none; }
  #hpPanel .hp-label { font-size: 9px; letter-spacing: 3px; color: rgba(255,255,255,.4); font-weight: 700; margin-bottom: 2px; }
  #hpText { font-size: 30px; font-weight: 900; color: #ff5555; line-height: 1; font-family: 'Arial Black', sans-serif; text-shadow: 0 0 12px rgba(255,60,60,.5); }
  #hpText.mid { color: #ffb04a; } #hpText.low { color: #6fdf6f; }
  #hpBar { height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  #hpFill { height: 100%; background: linear-gradient(90deg, #ff4444, #ffaa44); width: 100%; transition: width .3s ease-out; border-radius: 3px; }
  #kdRow { display: flex; gap: 14px; margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.1); font-family: 'Arial Black', sans-serif; font-size: 13px; font-weight: 900; }
  #kdRow .kd-kill { color: #6fdf6f; } #kdRow .kd-death { color: #ff8888; }
  #ammoPanel { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; align-items: center; background: linear-gradient(180deg, rgba(18,24,32,.9), rgba(8,12,18,.92)); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 6px 16px; z-index: 15; font-family: 'Arial Black', sans-serif; user-select: none; pointer-events: none; }
  #ammoText { font-size: 22px; font-weight: 900; color: #ffd166; }
  #ammoText.empty { color: #ff4444; } #ammoText.reloading { color: #7ec8ff; animation: blink .6s infinite; }
  #ammoText .ammo-reserve { font-size: 15px; opacity: 0.7; font-weight: 700; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0.4; } }
  #grenadeText { display: inline-flex; align-items: center; gap: 4px; font-size: 16px; color: #ffb04a; font-weight: 700; border-left: 1px solid rgba(255,255,255,.15); padding-left: 14px; }
  #grenadeText.empty { opacity: 0.3; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,.75); box-shadow: 0 0 6px rgba(0,0,0,.6); pointer-events: none; z-index: 4; transition: background .12s; }
  #cdBar { position: fixed; left: 50%; top: 50%; transform: translate(-50%, 0); margin-top: 16px; width: 46px; height: 4px; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.15); border-radius: 3px; z-index: 4; pointer-events: none; opacity: 0; transition: opacity .2s; overflow: hidden; }
  #cdBar.active { opacity: 1; }
  #cdFill { height: 100%; background: linear-gradient(90deg, #ff4444, #ffb04a); border-radius: 2px; width: 0%; }
  #hitmarker { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 22px; font-weight: 900; opacity: 0; pointer-events: none; z-index: 4; text-shadow: 0 0 6px #000, 0 0 4px #ff4444; transition: opacity .08s; }
  #hitmarker.show { opacity: 1; }
  #damageFlash { position: fixed; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(255,0,0,.55) 100%); opacity: 0; pointer-events: none; z-index: 19; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 20; }
  #spectatorInfo { position: fixed; left: 50%; top: 15%; transform: translateX(-50%); background: rgba(10,14,20,.85); color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 700; border: 1px solid rgba(255,255,255,.15); z-index: 18; display: none; text-align: center; pointer-events: none; }
  #spectatorInfo.visible { display: block; }
  #spectatorInfo .spec-killer { color: #ff8888; font-weight: 900; }
  #spectatorInfo .spec-timer { color: #ffb04a; font-size: 20px; display: block; margin-top: 4px; }
  #deathPanel { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%); background: linear-gradient(180deg, rgba(80,20,20,.94), rgba(30,8,8,.96)); border: 2px solid rgba(255,80,80,.5); border-radius: 12px; padding: 10px 20px; z-index: 17; display: none; text-align: center; min-width: 240px; pointer-events: none; }
  #deathPanel.visible { display: block; }
  .dp-row { display: flex; align-items: center; justify-content: center; gap: 8px; color: #fff; font-size: 13px; margin-bottom: 4px; }
  .dp-label { font-size: 9px; letter-spacing: 2px; color: rgba(255,255,255,.5); font-weight: 700; }
  .dp-killer { color: #ff8888; font-weight: 900; font-size: 15px; }
  .dp-weapon-row { display: flex; align-items: center; justify-content: center; gap: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.12); }
  .dp-weapon-name { color: #ffb04a; font-weight: 700; font-size: 12px; }
  #exitModal, #matchOverModal { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
  #exitModal.visible, #matchOverModal.visible { display: flex; }
  .exit-box, .mo-box { background: linear-gradient(180deg, #1a2432, #0a0e14); border: 2px solid rgba(255,255,255,.15); border-radius: 16px; padding: 24px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.85); animation: modalIn .25s ease-out; }
  .mo-box { border-color: rgba(255,176,74,.5); }
  @keyframes modalIn { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .exit-box h3, .mo-box h3 { color: #fff; font-size: 22px; margin-bottom: 8px; font-weight: 900; letter-spacing: 1px; }
  .mo-box h3 { color: #ffd166; text-shadow: 0 0 20px rgba(255,209,102,.5); }
  .exit-box p { color: rgba(255,255,255,.6); font-size: 13px; margin-bottom: 20px; }
  .exit-actions { display: flex; gap: 10px; }
  .exit-actions button { flex: 1; height: 48px; border: none; border-radius: 10px; font-size: 14px; font-weight: 800; cursor: pointer; transition: transform .1s; }
  .exit-actions button:active { transform: scale(.96); }
  #exitCancel { background: linear-gradient(180deg, #3a4554, #1e2530); color: #fff; }
  #exitConfirm { background: linear-gradient(180deg, #ff6b35, #c42a1a); color: #fff; }
  .mo-stats { display: flex; justify-content: center; gap: 30px; margin: 20px 0 24px; }
  .mo-stat { text-align: center; }
  .mo-stat .ms-num { font-size: 44px; font-weight: 900; font-family: 'Arial Black', sans-serif; line-height: 1; }
  .mo-stat .ms-label { font-size: 10px; letter-spacing: 3px; color: rgba(255,255,255,.5); font-weight: 700; margin-top: 4px; }
  .mo-stat.kills .ms-num { color: #6fdf6f; text-shadow: 0 0 20px rgba(111,223,111,.5); }
  .mo-stat.deaths .ms-num { color: #ff8888; text-shadow: 0 0 20px rgba(255,136,136,.5); }
  #moRestart { width: 100%; height: 52px; background: linear-gradient(180deg, #ffb04a, #d63d1e); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 900; letter-spacing: 3px; cursor: pointer; margin-bottom: 10px; }
  #moRestart:active { transform: scale(.97); }
  #moMenu { width: 100%; height: 44px; background: linear-gradient(180deg, #3a4554, #1e2530); color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 800; letter-spacing: 2px; cursor: pointer; }
  #moMenu:active { transform: scale(.97); }
  #pcHint { position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,.35); font-size: 11px; z-index: 15; pointer-events: none; text-align: center; font-family: monospace; transition: opacity .5s; }
  #pcHint.fade { opacity: 0; }
  #fuseTimer { position: fixed; left: 50%; top: 58%; transform: translateX(-50%); color: #ffaa44; font-size: 22px; font-weight: 900; letter-spacing: 2px; font-family: 'Arial Black', sans-serif; text-shadow: 0 0 10px rgba(0,0,0,.9); pointer-events: none; z-index: 16; display: none; }
  #fuseTimer.visible { display: block; }
  #fuseTimer.danger { color: #ff2222; animation: fuseBlink .3s infinite; }
  @keyframes fuseBlink { 50% { opacity: 0.35; } }
</style>
</head>
<body>

<div id="mainMenu">
  <div class="mm-content">
    <div class="mm-title">GRENADE ARENA</div>
    <div class="mm-subtitle">6 БОТОВ · 5 МИНУТ · 1 ГРАНАТА</div>
    <div class="mm-version">v0.1</div>
    <div class="mm-nick">
      <label>ТВОЙ НИК</label>
      <input id="nickInput" type="text" maxlength="16" value="Player" placeholder="Player" autocomplete="off" spellcheck="false">
    </div>
    <button id="playBtn">ИГРАТЬ</button>
    <button id="soloBtn">СВОБОДНЫЙ РЕЖИМ</button>
  </div>
  <div class="mm-footer">WASD · Мышь · ЛКМ · Tab · Esc</div>
</div>

<div id="statPanel"><span id="fpsText">60 FPS</span><span class="stat-divider">·</span><span id="botCountText" style="color:#ff8888">6 BOTS</span></div>
<div id="matchTimer">5:00</div>
<div id="killFeed"></div>
<div id="tabBtn"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7.5" r="3.4"/><path d="M3 19c0-3.4 2.7-6 6-6s6 2.6 6 6"/><circle cx="17.5" cy="8.5" r="2.4"/><path d="M15 19c0-2.2 1.5-4 3.4-4 .9 0 1.6.3 2.1.7"/></svg><span id="tabBadge">1</span></div>
<div id="exitBtn"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 001 1h3v-6h6v6h3a1 1 0 001-1V10"/></svg></div>
<div id="playerListOverlay"></div>
<div id="playerList"><div class="pl-header">ИГРОКИ</div><div id="playerListContent"></div></div>
<div id="spectatorInfo"></div>
<div id="deathPanel"><div class="dp-row"><span class="dp-label">ВАС УБИЛ</span><span class="dp-killer">—</span></div><div class="dp-weapon-row"><span class="dp-weapon-name">—</span></div></div>
<div id="joyBase"><div id="joyKnob"></div></div>
<div id="hpPanel">
  <div class="hp-label">HP</div>

function makeGroundTexture() {
  const S = 1024;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#5a5854'; ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 130; i++) {
    const x = Math.random() * S, y = Math.random() * S, r = 30 + Math.random() * 100;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);

    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
  const tileSize = S / 8;
  for (let gy = 0; gy < 8; gy++) {
    for (let gx = 0; gx < 8; gx++) {
      const x = gx * tileSize, y = gy * tileSize;
      const shade = 70 + Math.random() * 38;
      ctx.fillStyle = `rgba(20, 18, 15, 0.78)`;
      ctx.fillRect(x + 1, y + 1, tileSize - 2, tileSize - 2);
      ctx.fillStyle = `rgb(${shade|0}, ${(shade-3)|0}, ${(shade-8)|0})`;
      ctx.fillRect(x + 3, y + 3, tileSize - 6, tileSize - 6);
      for (let i = 0; i < 300; i++) {
        const v = shade + (Math.random() - 0.5) * 60;
        ctx.fillStyle = `rgba(${v|0}, ${(v-3)|0}, ${(v-8)|0}, ${0.3 + Math.random()*0.35})`;
        ctx.fillRect(x + 3 + Math.random() * (tileSize-6), y + 3 + Math.random() * (tileSize-6), 1 + Math.random()*3, 1 + Math.random()*3);
      }
      ctx.fillStyle = `rgba(255, 250, 240, 0.11)`;
      ctx.fillRect(x + 3, y + 3, tileSize - 6, 2);
      ctx.fillStyle = `rgba(0, 0, 0, 0.3)`;
      ctx.fillRect(x + 3, y + tileSize - 5, tileSize - 6, 2);
    }
  }
  for (let i = 0; i < 32; i++) {
    ctx.strokeStyle = `rgba(15, 13, 10, ${0.55 + Math.random()*0.4})`;
    ctx.lineWidth = 0.5 + Math.random() * 1.5;
    ctx.beginPath();
    let x = Math.random() * S, y = Math.random() * S;
    ctx.moveTo(x, y);
    const segs = 4 + Math.random() * 5;
    for (let s = 0; s < segs; s++) {

}

function resolveWalls(pos, radius) {
  for (const w of walls) {
    if (pos.y >= w.height - 0.1) continue;
    if (pos.y + 1.7 < w.yBase) continue;
    // Разрешаем шагать на низкие ступеньки (высота над игроком <= STEP_UP_MAX)
    if (w.height > 0.1 && w.height - pos.y <= STEP_UP_MAX) continue;
    const cx = Math.max(w.minX, Math.min(pos.x, w.maxX));
    const cz = Math.max(w.minZ, Math.min(pos.z, w.maxZ));
    const dx = pos.x - cx, dz = pos.z - cz;
    const d2 = dx*dx + dz*dz;
    if (d2 < radius*radius) {
      if (d2 > 0.0001) {
        const d = Math.sqrt(d2);
        pos.x += (dx/d)*(radius-d); pos.z += (dz/d)*(radius-d);
      } else {
        const pL = pos.x - w.minX, pR = w.maxX - pos.x;
        const pN = pos.z - w.minZ, pS = w.maxZ - pos.z;

function botPickTarget(bot) {
  const candidates = [];
  const botHeadPos = new THREE.Vector3(bot.pos.x, bot.pos.y + 1.35, bot.pos.z);
  if (!isDead && !matchEnded) {
    const dist = bot.pos.distanceTo(player.pos);
    let w = 1.2;
    if (dist < 15) w *= 1.8; else if (dist < 25) w *= 1.3; else if (dist > 45) w *= 0.3;
    const los = hasLineOfSight(botHeadPos, new THREE.Vector3(player.pos.x, player.pos.y + 1.35, player.pos.z));
    if (los) w *= 2.5;
    if (bot.target === 'player') w *= 1.8;
    const dx = player.pos.x - bot.pos.x, dz = player.pos.z - bot.pos.z;
    const angleDiff = Math.abs(normalizeAngle(Math.atan2(dx, dz) - bot.yaw));
    if (angleDiff > 1.8) w *= 0.4;
    candidates.push({ t: 'player', d: dist, w, los });
  }
  for (const b of bots) {
    if (b === bot || !b.alive) continue;
    const dist = bot.pos.distanceTo(b.pos);
    let w = 2.2;
    if (b.hp < BOT_HP * 0.5) w *= 1.6;
    if (b.hp < BOT_HP * 0.25) w *= 1.4;
    const los = hasLineOfSight(botHeadPos, new THREE.Vector3(b.pos.x, b.pos.y + 1.35, b.pos.z));
    if (los) w *= 2;
    const dx = b.pos.x - bot.pos.x, dz = b.pos.z - bot.pos.z;
    const angleDiff = Math.abs(normalizeAngle(Math.atan2(dx, dz) - bot.yaw));
    if (angleDiff < 0.6) w *= 1.7; else if (angleDiff > 1.6) w *= 0.4;
    if (bot.target === b) w *= 1.5;
    w *= 1 / (1 + dist * 0.04);
    candidates.push({ t: b, d: dist, w, los });
  }
  if (candidates.length === 0) { bot.target = null; return; }
  let total = 0;
  for (const c of candidates) total += c.w;
  let r = Math.random() * total;
  let newTarget = candidates[0].t;
  for (const c of candidates) {
    r -= c.w;
    if (r <= 0) { newTarget = c.t; break; }
  }
  if (newTarget !== bot.target && newTarget !== null) {
    const distP = bot.pos.distanceTo(player.pos);
    const baseReaction = Math.max(0.08, 0.48 - distP * 0.014);  // было 0.12, 0.55
    bot.reactionTimer = baseReaction + Math.random() * 0.22;
    if (newTarget === 'player' && distP < 25 && !bot.hadTarget) {
      playBotAlert(Math.max(0.1, 1 - distP / 25) * 0.8);
    }
  }
  bot.target = newTarget;
  bot.hadTarget = !!newTarget;
}

function damageBot(bot, amount, killer) {
  if (!bot.alive) return;
  bot.hp -= amount;
  bot.flinchTime = 0.25;
  if (killer === 'player') {
    bot.target = 'player'; bot.retargetTimer = 0.15; bot.reactionTimer = 0.1; bot.hadTarget = true;
  }
  if (bot.hp <= 0) {
    bot.hp = 0; bot.alive = false; bot.deathTimer = BOT_DEATH_FALL;
    bot.respawnTimer = BOT_RESPAWN; bot.reloadTimer = 0;
    const distP = bot.pos.distanceTo(player.pos);
    playBotDeathSound(Math.max(0.1, 1 - distP / 30) * 0.9);
    const killerName = killer === 'player' ? myName : (killer && killer.name ? killer.name : '?');
    addKillFeed(killerName, bot.name, 'pistol');
    if (killer === 'player' && !matchEnded) { kills++; updateKillCounter(); playKill(); }
    for (const b of bots) if (b.target === bot) b.target = null;
    updateBadge();
  } else {
    if (killer && killer !== 'player' && killer.alive && Math.random() < 0.9) {
      bot.target = killer; bot.retargetTimer = 0.2; bot.fireTimer = 0.1;
    }
    if (bot.hp < BOT_HP * 0.5) bot.rageMode = true;
  }
}

function botShootAt(bot, targetPos, targetKind, targetVel) {
  const start = new THREE.Vector3(bot.pos.x, bot.pos.y + 1.35, bot.pos.z);
  const aimPos = targetPos.clone();
  if (targetVel) {
    const dist0 = start.distanceTo(aimPos);
    const bulletSpeed = 90;
    const leadTime = Math.min(0.4, dist0 / bulletSpeed);
    aimPos.x += targetVel.x * leadTime;
    aimPos.z += targetVel.z * leadTime;
  }
  const dist = start.distanceTo(aimPos);
  const wobbleFactor = bot.rageMode ? 0.45 : 1.0;
  const wobbleSize = Math.min(0.5, 0.06 + dist * 0.007) * wobbleFactor;
  const wobble = new THREE.Vector3(
    (Math.random() - 0.5) * wobbleSize,
    (Math.random() - 0.5) * wobbleSize * 0.4,
    (Math.random() - 0.5) * wobbleSize
  );
  const end = aimPos.clone().add(new THREE.Vector3(0, 1.2, 0)).add(wobble);
  const dir = new THREE.Vector3().subVectors(end, start).normalize();
  const muzzleWorld = new THREE.Vector3();
  if (bot.mesh.userData.botGunMuzzle) bot.mesh.userData.botGunMuzzle.getWorldPosition(muzzleWorld);
  else muzzleWorld.copy(start).addScaledVector(dir, 0.5);
  spawnMuzzleFlash(muzzleWorld);
  const vol = Math.max(0.15, Math.min(1, 1 - player.pos.distanceTo(bot.pos) / 40));
  playShoot(vol * 0.6);
  if (!hasLineOfSight(start, end)) return;
  const baseChance = Math.max(0.32, 0.72 - dist * 0.008);  // было 0.28, 0.68
  const hitChance = bot.rageMode ? Math.min(0.96, baseChance * 1.25) : baseChance;
  if (Math.random() > hitChance) return;
  const isHead = Math.random() < BOT_HEADSHOT_CHANCE;
  const dmg = isHead ? BOT_DMG_HEAD : BOT_DMG_BODY;
  if (targetKind === 'player') {
    if (isDead || matchEnded) return;
    lastDamageFrom = bot;
    applyDamageToSelf(dmg, bot, 'pistol');
  } else if (targetKind && targetKind.alive) {
    damageBot(targetKind, dmg, bot);
  }
}

function updateBots(dt) {
  for (const bot of bots) {
    if (!bot.alive) {
      if (bot.deathTimer > 0) {
        bot.deathTimer -= dt;
        const fp = 1 - Math.max(0, bot.deathTimer) / BOT_DEATH_FALL;
        const ease = fp * fp;
        bot.mesh.rotation.x = ease * (Math.PI / 2.2);
        bot.mesh.rotation.z = ease * (Math.PI / 5);
        bot.mesh.position.y = -ease * 0.15;
        if (bot.deathTimer <= 0) bot.mesh.visible = false;
      }
      bot.respawnTimer -= dt;
      if (bot.respawnTimer <= 0) {
        const sp = pickSpawn(player.pos);
        const safePos = sp.clone(); resolveWalls(safePos, PLAYER_RADIUS);
        bot.pos.set(safePos.x, 0, safePos.z);
        bot.mesh.position.set(safePos.x, 0, safePos.z);
        bot.mesh.rotation.set(0, bot.yaw, 0);
        bot.mesh.visible = true;
        bot.hp = BOT_HP; bot.alive = true; bot.target = null;
        bot.retargetTimer = 0.2 + Math.random() * 0.3; bot.fireTimer = 0.15;
        bot.yaw = Math.random() * Math.PI * 2;
        bot.lastPos.copy(bot.pos); bot.lastFramePos.copy(bot.pos); bot.velocity.set(0,0,0);
        bot.stuckTimer = 0; bot.stuckDir = null; bot.animBlend = 0; bot.rageMode = false;
        bot.state = 'idle'; bot.stateTimer = 0; bot.magAmmo = BOT_MAG_SIZE;
        bot.reloadTimer = 0; bot.burstShots = 0; bot.burstCooldown = 0; bot.reactionTimer = 0;
        bot.deathTimer = 0; bot.gunKick = 0; bot.flinchTime = 0; bot.hadTarget = false;
        bot.targetHeadYaw = 0; bot.targetHeadPitch = 0;
        bot.scanTimer = Math.random() * 1.5; bot.scanAngle = 0;
        bot.stepTimer = 0; bot.alertTimer = 0;
        updateBadge();
      }
      continue;
    }
    if (bot.flinchTime > 0) bot.flinchTime = Math.max(0, bot.flinchTime - dt * 4);
    if (bot.burstCooldown > 0) bot.burstCooldown -= dt;
    if (bot.reactionTimer > 0) bot.reactionTimer -= dt;
    if (bot.gunKick > 0) bot.gunKick = Math.max(0, bot.gunKick - dt * 9);
    if (bot.alertTimer > 0) bot.alertTimer -= dt;
    if (bot.reloadTimer > 0) {
      bot.reloadTimer -= dt;
      if (bot.reloadTimer <= 0) {
        bot.reloadTimer = 0; bot.magAmmo = BOT_MAG_SIZE; bot.state = 'combat'; bot.burstShots = 0;
        const distP = bot.pos.distanceTo(player.pos);
        playBotReload(Math.max(0.1, 1 - distP / 20) * 0.5);
      }
    }
    const movedDist = bot.pos.distanceTo(bot.lastPos);
    if (movedDist < 0.08) {
      bot.stuckTimer += dt;
      if (bot.stuckTimer > 0.6) {
        if (!bot.stuckDir || bot.stuckTimer > 1.6) {
          const baseAng = Math.atan2(bot.pos.z, bot.pos.x);
          const angs = [0.9, -0.9, 1.6, -1.6, Math.PI];
          const ang = angs[Math.floor(Math.random() * angs.length)];
          bot.stuckDir = new THREE.Vector3(Math.sin(baseAng + ang), 0, Math.cos(baseAng + ang));
          bot.stuckTimer = 0;
        }
      }
    } else { bot.stuckTimer = 0; bot.stuckDir = null; }
    bot.lastPos.copy(bot.pos);
    bot.retargetTimer -= dt;
    if (bot.retargetTimer <= 0) { bot.retargetTimer = 0.5 + Math.random() * 0.7; botPickTarget(bot); }
    if (bot.target === 'player' && (isDead || matchEnded)) bot.target = null;
    if (bot.target && bot.target !== 'player' && !bot.target.alive) bot.target = null;
    let targetPos = null, targetVel = null, targetHeadY = 1.55, targetBaseY = 0;
    if (bot.target === 'player' && !isDead) { targetPos = player.pos; targetVel = playerVel; targetHeadY = player.height - 0.15; targetBaseY = player.pos.y; }
    else if (bot.target && bot.target !== 'player' && bot.target.alive) { targetPos = bot.target.pos; targetVel = bot.target.velocity; targetHeadY = 1.55; targetBaseY = bot.target.pos.y; }
    let moveSpeed = 0;
    const desiredMoveDir = new THREE.Vector3();
    if (!targetPos) {
      bot.state = 'idle';
      bot.wanderTimer -= dt;
      if (bot.wanderTimer <= 0) { bot.wanderTimer = 1.5 + Math.random() * 2; const ang = Math.random() * Math.PI * 2; bot.wanderDir.set(Math.sin(ang), 0, Math.cos(ang)); }
      desiredMoveDir.copy(bot.wanderDir); moveSpeed = BOT_SPEED_WANDER;
      if (bot.wanderDir.lengthSq() > 0.001) { const wy = Math.atan2(bot.wanderDir.x, bot.wanderDir.z); bot.yaw += normalizeAngle(wy - bot.yaw) * Math.min(1, dt * 3); }
      bot.scanTimer -= dt;
      if (bot.scanTimer <= 0) { bot.scanTimer = 1.2 + Math.random() * 1.8; bot.scanAngle = (Math.random() - 0.5) * 1.5; }
      bot.targetHeadYaw = bot.scanAngle; bot.targetHeadPitch = (Math.random() - 0.5) * 0.1;
      if (bot.alertTimer > 0 && !isDead) { bot.target = 'player'; bot.hadTarget = true; }
    } else {
      if (bot.state !== 'retreat' && bot.reloadTimer <= 0) bot.state = 'combat';
      const dx = targetPos.x - bot.pos.x, dz = targetPos.z - bot.pos.z;
      const dist = Math.max(0.001, Math.hypot(dx, dz));
      const targetYaw = Math.atan2(dx, dz);
      const turnSpeed = bot.rageMode ? 9 : 5.5;
      bot.yaw += clamp(normalizeAngle(targetYaw - bot.yaw), -turnSpeed * dt, turnSpeed * dt);
      const headDeltaYaw = normalizeAngle(targetYaw - bot.yaw);
      bot.targetHeadYaw = clamp(headDeltaYaw, -0.9, 0.9);
      const headHeight = bot.pos.y + 1.65;
      const aimPitch = Math.atan2(targetHeadY + targetBaseY - headHeight, dist);
      bot.targetHeadPitch = -aimPitch * 0.85;
      const botHead = new THREE.Vector3(bot.pos.x, bot.pos.y + 1.35, bot.pos.z);
      const targetHead = new THREE.Vector3(targetPos.x, targetHeadY + targetBaseY, targetPos.z);
      const hasLOS = hasLineOfSight(botHead, targetHead);
      if (bot.state === 'retreat') {
        const nx = -dx / dist, nz = -dz / dist;
        const perpX = -nz * bot.strafeDir, perpZ = nx * bot.strafeDir;
        desiredMoveDir.set(nx * 0.7 + perpX * 0.7, 0, nz * 0.7 + perpZ * 0.7);
        if (desiredMoveDir.lengthSq() > 0.0001) desiredMoveDir.normalize();
        moveSpeed = BOT_SPEED_CHASE * 1.1;
        bot.stateTimer -= dt;
        if (bot.stateTimer <= 0) bot.state = 'combat';
      } else if (dist > BOT_STOP_RANGE) {
        if (hasLOS) {
          bot.loseSightTimer = 0;
          const nx = dx / dist, nz = dz / dist;
          bot.strafeTimer -= dt;
          if (bot.strafeTimer <= 0) { bot.strafeTimer = 0.5 + Math.random() * 1.0; bot.strafeDir *= -1; }
          const strafe = 0.35 + bot.aggression * 0.15;
          desiredMoveDir.set(nx - nz * bot.strafeDir * strafe, 0, nz + nx * bot.strafeDir * strafe);
          if (desiredMoveDir.lengthSq() > 0.0001) desiredMoveDir.normalize();
          moveSpeed = BOT_SPEED_CHASE;
        } else {
          bot.loseSightTimer += dt;
          const nx = dx / dist, nz = dz / dist;
          const side = Math.sin(bot.loseSightTimer * 1.5) > 0 ? 1 : -1;
          desiredMoveDir.set(-nz * side * 0.7 + nx * 0.5, 0, nx * side * 0.7 + nz * 0.5);
          if (desiredMoveDir.lengthSq() > 0.0001) desiredMoveDir.normalize();
          moveSpeed = BOT_SPEED_CHASE * 0.95;
          if (bot.loseSightTimer > 5) { bot.strafeDir *= -1; bot.loseSightTimer = 0; }
        }
      } else if (dist < BOT_MIN_DIST) {
        const nx = -dx / dist, nz = -dz / dist;
        desiredMoveDir.set(nx, 0, nz); moveSpeed = BOT_SPEED_WANDER;
      }
      bot.fireTimer -= dt;
      if (bot.state === 'combat' && hasLOS && dist < BOT_ATTACK_RANGE &&
          bot.reactionTimer <= 0 && bot.burstCooldown <= 0 && bot.reloadTimer <= 0) {
        if (bot.fireTimer <= 0 && bot.magAmmo > 0 && !matchEnded) {
          botShootAt(bot, targetPos, bot.target, targetVel);
          bot.magAmmo--; bot.burstShots++; bot.gunKick = 1;
          if (bot.magAmmo <= 0) {
            bot.state = 'reload'; bot.reloadTimer = BOT_RELOAD_TIME + Math.random() * 0.5;
            bot.burstShots = 0; bot.fireTimer = 0.3;
            const distP = bot.pos.distanceTo(player.pos);
            playBotReload(Math.max(0.1, 1 - distP / 18) * 0.6);
          } else if (bot.burstShots >= 3 + Math.floor(Math.random() * 3)) {
            bot.burstShots = 0; bot.burstCooldown = 0.3 + Math.random() * 0.4;
            bot.fireTimer = bot.burstCooldown;
          } else { bot.fireTimer = 0.11 + Math.random() * 0.08; }
          if (bot.hp < BOT_HP * 0.35 && bot.state === 'combat' && Math.random() < 0.5) {
            bot.state = 'retreat'; bot.stateTimer = 1.0 + Math.random() * 1.2;
            bot.strafeDir = Math.random() < 0.5 ? 1 : -1;
          }
        }
      }
    }
    if (bot.stuckDir) {
      bot.pos.x += bot.stuckDir.x * BOT_SPEED_CHASE * dt;
      bot.pos.z += bot.stuckDir.z * BOT_SPEED_CHASE * dt;
    } else if (moveSpeed > 0) {
      bot.pos.x += desiredMoveDir.x * moveSpeed * dt;
      bot.pos.z += desiredMoveDir.z * moveSpeed * dt;
    }
    for (const other of bots) {
      if (other === bot || !other.alive) continue;
      const ddx = bot.pos.x - other.pos.x, ddz = bot.pos.z - other.pos.z;
      const dd = Math.hypot(ddx, ddz);
      const minDist = PLAYER_RADIUS * 2;
      if (dd < minDist && dd > 0.001) {
        const push = (minDist - dd) * 0.5;
        bot.pos.x += (ddx / dd) * push; bot.pos.z += (ddz / dd) * push;
      }
    }
    const gyB = groundHeightAt(bot.pos.x, bot.pos.z, bot.pos.y);
    bot.pos.y = gyB;
    resolveWalls(bot.pos, PLAYER_RADIUS);
    bot.pos.x = clamp(bot.pos.x, -29.3, 29.3);
    bot.pos.z = clamp(bot.pos.z, -29.3, 29.3);
    bot.velocity.set(
      (bot.pos.x - bot.lastFramePos.x) / Math.max(dt, 0.001), 0,
      (bot.pos.z - bot.lastFramePos.z) / Math.max(dt, 0.001)
    );
    bot.lastFramePos.copy(bot.pos);
    const isMoving = moveSpeed > 0.3 || !!bot.stuckDir;
    if (isMoving) {
      bot.walkPhase += dt * (2.8 + moveSpeed * 1.4);
      bot.animBlend = Math.min(1, bot.animBlend + dt * 7);
    } else { bot.animBlend = Math.max(0, bot.animBlend - dt * 7); }

    bot.mesh.userData.legLPivot.rotation.x = swing;
    bot.mesh.userData.legRPivot.rotation.x = -swing;
    bot.mesh.userData.bootL.rotation.x = -swing * 0.85;
    bot.mesh.userData.bootR.rotation.x = swing * 0.85;
    const bobY = -Math.abs(Math.sin(bot.walkPhase)) * 0.04 * bot.animBlend;
    if (bot.mesh.userData.headPivot) {
      const hp = bot.mesh.userData.headPivot;
      hp.rotation.y += (bot.targetHeadYaw - hp.rotation.y) * Math.min(1, dt * 9);
      hp.rotation.x += (bot.targetHeadPitch - hp.rotation.x) * Math.min(1, dt * 9);
    }
    const armBob = Math.sin(bot.walkPhase * 2) * 0.025 * bot.animBlend;
    const aimPitchArm = bot.targetHeadPitch;
    const recoilKick = bot.gunKick * 0.35;
    bot.mesh.userData.armRPivot.rotation.x = Math.PI / 2 + aimPitchArm - armBob - recoilKick;
    bot.mesh.userData.armLPivot.rotation.x = Math.PI / 2 - aimPitchArm * 0.5 + armBob * 0.7;
    const flinchAmp = bot.flinchTime * 0.15;
    const flinchX = flinchAmp * Math.sin((0.25 - bot.flinchTime) * 60);
    bot.mesh.position.set(bot.pos.x, bot.pos.y + bobY, bot.pos.z);
    bot.mesh.rotation.y = bot.yaw;
    bot.mesh.rotation.x = flinchX;
    bot.stepTimer -= dt;
    if (isMoving && bot.stepTimer <= 0) {
      bot.stepTimer = 0.4 + Math.random() * 0.15;
      const distP = bot.pos.distanceTo(player.pos);
      if (distP < 18) playFootstep(Math.max(0, 1 - distP / 18) * 0.35);

}

function updateGrenade(dt) {

  const len = wish.length(); if (len > 1) wish.divideScalar(len);
  playerVel.lerp(wish.multiplyScalar(WALK_SPEED), 1 - Math.exp(-13*dt));
  player.pos.x += playerVel.x*dt; player.pos.z += playerVel.z*dt;

  prevYVY = playerVY;
  if (!isGrounded) {
    playerVY -= PLAYER_GRAVITY*dt;
    player.pos.y += playerVY*dt;
    const gy = groundHeightAt(player.pos.x, player.pos.z, player.pos.y + 0.3);
    if (player.pos.y <= gy) {
      player.pos.y = gy; playerVY = 0; isGrounded = true;
      if (prevYVY < -4) landDip = Math.min(1, -prevYVY / 8);
    }
  } else {
    const gyNow = groundHeightAt(player.pos.x, player.pos.z, player.pos.y);
    if (player.pos.y > gyNow + 0.1) {
      // Маленький спуск — шаг вниз (мгновенно), большой — падение
      if (player.pos.y - gyNow <= STEP_UP_MAX) {
        player.pos.y = gyNow;
      } else {
        isGrounded = false;
      }
    } else {
      player.pos.y = gyNow;
    }
  }
  resolveWalls(player.pos, PLAYER_RADIUS);
  player.pos.x = clamp(player.pos.x, -29.3, 29.3);
  player.pos.z = clamp(player.pos.z, -29.3, 29.3);
  if (isGrounded) {
    const gyNow = groundHeightAt(player.pos.x, player.pos.z, player.pos.y);
    if (Math.abs(player.pos.y - gyNow) < 0.6) player.pos.y = gyNow;
  }
  moving = Math.min(1, playerVel.length()/WALK_SPEED);
  bobT += dt*playerVel.length()*2.3;
  const bY = Math.sin(bobT*2)*0.032*moving, bX = Math.cos(bobT)*0.022*moving;
  camera.position.set(player.pos.x + bX*0.4, player.pos.y + player.height + bY, player.pos.z);
  camera.rotation.set(player.pitch + camKickPitch, player.yaw + camKickYaw, 0);
}

function updateWeapon(dt) {
  throwPunch = Math.max(0, throwPunch - dt*4.5);
  recoil = Math.max(0, recoil - dt*8);
  const rk = recoil*recoil;
  camKickPitch *= Math.exp(-dt*15);
  camKickYaw *= Math.exp(-dt*15);
  idleTime += dt;
  const breathY = Math.sin(idleTime * 1.3) * 0.0035;
  const breathRoll = Math.sin(idleTime * 0.9 + 0.5) * 0.008;
  const breathPitch = Math.cos(idleTime * 1.1) * 0.006;
  const walkT = bobT * 2;
  const walkY = Math.sin(walkT) * 0.017 * moving;
  const walkX = Math.cos(walkT * 0.5) * 0.014 * moving;
  const walkRoll = Math.sin(walkT) * 0.035 * moving;
  const walkPitch = Math.cos(walkT * 2) * 0.014 * moving;
  landDip = Math.max(0, landDip - dt * 3.5);
  const landY = -landDip * landDip * 0.06;
  const landPitch = landDip * landDip * 0.08;
  const kickY = rk * 0.02;
  const kickPitch = rk * 0.16;
  const kickRoll = rk * 0.05;
  const kickZ = rk * 0.04;

  let rTilt = 0, magDrop = 0, magVis = true;
  if (isReloading) {
    reloadTimer -= dt;
    const t = 1 - reloadTimer/RELOAD_TIME;
    if (t < 0.12) rTilt = t/0.12;
    else if (t < 0.88) rTilt = 1;
    else rTilt = (1-t)/0.12;
    rTilt = rTilt*rTilt*(3-2*rTilt);
    if (t < 0.10) { magDrop = 0; magVis = true; }
    else if (t < 0.38) { const p = (t-0.10)/0.28; magDrop = 0.20*p*p; magVis = true; }
    else if (t < 0.50) { magDrop = 0.20; magVis = false; }
    else if (t < 0.80) { const p = (t-0.50)/0.30; const e = 1-(1-p)*(1-p); magDrop = 0.20*(1-e); magVis = true; }
    else if (t < 0.90) { const p = (t-0.80)/0.10; magDrop = -Math.sin(p*Math.PI)*0.03; magVis = true; }
    else { magDrop = 0; magVis = true; }
    if (reloadTimer <= 0) finishReload();
  }
  const tLift = grenadeHolding ? 1 : 0;
  grenadeHoldLift += (tLift - grenadeHoldLift) * Math.min(1, dt*12);
  if (currentWeapon === 'pistol') {
    pistolGroup.position.set(
      WEAPON_POS_X + walkX - rTilt*0.05,
      WEAPON_POS_Y + walkY + breathY + kickY + landY + rTilt*0.11,
      WEAPON_POS_Z + kickZ + rTilt*0.02
    );
    pistolGroup.rotation.set(
      0.03 + walkPitch + breathPitch + kickPitch + landPitch + rTilt*0.14,
      PISTOL_YAW - rTilt*(PISTOL_YAW-0.02),
      walkRoll + breathRoll + kickRoll + rTilt*0.16
    );
    const mag = proceduralPistol.userData.magazine;
    if (mag) {
      const home = proceduralPistol.userData.magazineHome;
      const sA = Math.sin(0.2), cA = Math.cos(0.2);
      mag.position.set(home.x + sA*magDrop + magDrop*0.32, home.y - cA*magDrop, home.z);
      mag.visible = magVis;
    }
  } else if (currentWeapon === 'grenade') {
    const lift = grenadeHoldLift;
    heldGrenadeGroup.position.set(WEAPON_POS_X + walkX - lift*0.02, WEAPON_POS_Y + walkY + breathY + lift*0.14, WEAPON_POS_Z + lift*0.06);
    heldGrenadeGroup.rotation.set(0.12 - lift*0.30 + breathPitch, 0.5 - lift*0.15, -0.22 + lift*0.10 + breathRoll);
    if (held) {
      heldGrow = Math.min(1, heldGrow + dt*5.5);
      const c1 = 1.70158, c3 = c1+1;
      const e = 1 + c3*Math.pow(heldGrow-1, 3) + c1*Math.pow(heldGrow-1, 2);
      held.scale.setScalar(GRENADE_SCALE*e);
    }
  }
}
function updateEffects(dt) { for (let i = effects.length-1; i >= 0; i--) if (effects[i](dt) === false) effects.splice(i, 1); }

    e.preventDefault();
    if (currentWeapon === 'grenade') throwGrenade();
    else if (noBotsMode || grenadesLeft > 0) { selectWeapon('grenade'); throwGrenade(); }
    return;
  }
  if (e.code === 'Digit1') selectWeapon('pistol');
  if (e.code === 'Digit2' || e.code === 'Digit3') selectWeapon('grenade');
  keys[e.code] = true;
});
window.addEventListener('keyup', e => {
  if (!gameStarted) return;
  if (e.code === 'Tab') { e.preventDefault(); setPlayerListOpen(false); return; }
  keys[e.code] = false;
});
function keyboardMove() {
  if (!gameStarted || isDead) { joy.x = 0; joy.y = 0; return; }
  let kx = 0, ky = 0;
  if (keys['KeyW'] || keys['ArrowUp']) ky += 1;
  if (keys['KeyS'] || keys['ArrowDown']) ky -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) kx += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) kx -= 1;
  if (kx || ky) { const l = Math.hypot(kx, ky); joy.x = kx/l; joy.y = ky/l; }
  else { joy.x = 0; joy.y = 0; }
}
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

function startReload() {
  if (isReloading || isDead || currentWeapon !== 'pistol' || matchEnded) return;
  if (ammoInMag >= MAG_SIZE || reserveAmmo <= 0) return;
  isReloading = true; reloadTimer = RELOAD_TIME; playReloadStart(); updateAmmoUI();
}
function finishReload() {
  const need = MAG_SIZE - ammoInMag;
  const take = Math.min(need, reserveAmmo);
  ammoInMag += take; reserveAmmo -= take;
  isReloading = false; playReloadEnd(); updateAmmoUI();
}

function shoot() {
  if (currentWeapon !== 'pistol' || isDead || !gameStarted || matchEnded) return;
  if (fireTimer > 0 || isReloading) return;
  if (ammoInMag <= 0) { startReload(); return; }
  ammoInMag--; updateAmmoUI(); fireTimer = FIRE_INTERVAL; recoil = 1;
  shake = Math.max(shake, 0.12); playShoot(1);
  const muzzlePos = new THREE.Vector3(); muzzlePoint.getWorldPosition(muzzlePos);
  spawnMuzzleFlash(muzzlePos);
  for (const bot of bots) {
    if (!bot.alive) continue;
    const dist = bot.pos.distanceTo(player.pos);
    if (dist < 35 && !bot.target) bot.alertTimer = 2.5;
  }
  const rc = new THREE.Raycaster();
  rc.setFromCamera(new THREE.Vector2(0,0), camera); rc.far = BULLET_RANGE;
  const targets = [...shootTargets];
  for (const bot of bots) if (bot.alive) bot.mesh.traverse(o => { if (o.isMesh) targets.push(o); });
  const hits = rc.intersectObjects(targets, false);
  if (hits.length > 0) {
    const hit = hits[0]; let cur = hit.object, bid = null, part = null;
    while (cur) { if (cur.userData && cur.userData.botId) { part = cur.userData.hitPart; bid = cur.userData.botId; break; } cur = cur.parent; }
    if (bid) {
      const bot = botMap.get(bid);
      if (bot) {
        const dmg = part === 'head' ? DMG_HEAD : DMG_BODY;
        damageBot(bot, dmg, 'player');
        showHitmarker();
      }
    } else {
      let normal = new THREE.Vector3(0,1,0);
      if (hit.face) normal.copy(hit.face.normal).transformDirection(hit.object.matrixWorld);
      spawnImpact(hit.point, normal, hit.object === groundMesh);
    }
  }
  if (ammoInMag === 0) startReload();
  camKickPitch += 0.010 + Math.random()*0.005;
  camKickYaw += (Math.random()-0.5)*0.004;
}

const clock = new THREE.Clock();
let playerListTick = 0;
let menuOrbit = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (!gameStarted) {
    menuOrbit += dt * 0.08;
    const r = 22;
    camera.position.set(Math.cos(menuOrbit) * r, 14 + Math.sin(menuOrbit * 1.3) * 2.5, Math.sin(menuOrbit) * r);
    camera.lookAt(0, 2.5, 0);
    pistolGroup.visible = false;
    heldGrenadeGroup.visible = false;
    vmLight.intensity = 0;
    skyMesh.position.copy(camera.position);
    sun.position.set(camera.position.x + 26, 42, camera.position.z + 18);
    sun.target.position.set(0, 0, 0);
    sun.target.updateMatrixWorld();
    renderer.render(scene, camera);
    return;
  }

  vmLight.intensity = 3.2;

  fpsFrames++; fpsTimer += dt;
  if (fpsTimer >= 0.5) { currentFPS = Math.round(fpsFrames/fpsTimer); fpsFrames = 0; fpsTimer = 0; }
  statsUpdateTimer += dt;
  if (statsUpdateTimer >= 0.5) { statsUpdateTimer = 0; updateStatsUI(); }

  if (gameStarted && !matchEnded) {
    if (noBotsMode) {
      // Соло: время идёт вверх
      soloTime += dt;
      const ceilSec = Math.ceil(soloTime);
      if (ceilSec !== lastTimerShown) { lastTimerShown = ceilSec; updateMatchTimerUI(); }
    } else {
      matchTimeLeft -= dt;
      if (matchTimeLeft <= 0) { matchTimeLeft = 0; endMatch(); }
      const ceilSec = Math.ceil(matchTimeLeft);
      if (ceilSec !== lastTimerShown) { lastTimerShown = ceilSec; updateMatchTimerUI(); }
    }
  }

  if (fireTimer > 0) fireTimer -= dt;

  if (gameStarted && !isDead && !matchEnded && currentWeapon === 'pistol' && fireTimer > 0 && !isReloading) {
    cdBarEl.classList.add('active');
    const prog = Math.max(0, Math.min(1, 1 - fireTimer / FIRE_INTERVAL));
    cdFillEl.style.width = (prog * 100) + '%';
    const g = Math.round(90 + prog * 165);
    crosshairEl.style.background = `rgba(255,${g},${g},0.85)`;
  } else {
    cdBarEl.classList.remove('active');
    crosshairEl.style.background = 'rgba(255,255,255,.75)';
  }

  if (firingHeld && currentWeapon === 'pistol' && !isReloading && ammoInMag > 0 && !isDead && !matchEnded
      && !exitModal.classList.contains('visible') && !matchOverModal.classList.contains('visible')) {
    shoot();
  }

  keyboardMove(); updateJoyIndicator();
  updatePlayer(dt);
  if (gameStarted && !matchEnded) updateBots(dt);
  updateWeapon(dt); updateGrenade(dt); updateEffects(dt);

  if (grenadeHolding) {
    grenadeHoldTime += dt;
    const rem = Math.max(0, FUSE - grenadeHoldTime);
    fuseTimerEl.textContent = rem.toFixed(1) + 's';
    fuseTimerEl.classList.add('visible');
    fuseTimerEl.classList.toggle('danger', rem < 1.3);
    if (rem < 1.3) {
      fuseBeepTimer -= dt;
      if (fuseBeepTimer <= 0) { playFuse(0.9); fuseBeepTimer = 0.12 + Math.max(0.12, rem/1.3)*0.3; }
    }
    if (grenadeHoldTime >= FUSE) {
      grenadeHolding = false; grenadeHoldTime = 0;
      fuseTimerEl.classList.remove('visible', 'danger');
      explodeGrenadeInHand();
    }
  } else { fuseTimerEl.classList.remove('visible', 'danger'); }

  if (gameStarted && !isDead && moving > 0.25 && isGrounded && !matchEnded) {
    footstepTimer -= dt;
    if (footstepTimer <= 0) { playFootstep(0.9); footstepTimer = 0.36 - moving*0.06 + Math.random()*0.04; }
  } else footstepTimer = 0;

  if (isDead && !matchEnded) {
    const st = document.getElementById('specTimer');
    if (st) st.textContent = Math.ceil(deathTimer);
  }
  playerListTick += dt;
  if (playerListTick > 1 && playerListOpen) { playerListTick = 0; updatePlayerList(); }

  if (shake > 0) {
    shake = Math.max(0, shake - dt*4.2);
    const s = shake*shake*0.11;
    camera.position.x += (Math.random()-0.5)*s;
    camera.position.y += (Math.random()-0.5)*s;
    camera.position.z += (Math.random()-0.5)*s;
    camera.rotation.z = (Math.random()-0.5)*s*0.22;
  } else camera.rotation.z = 0;
  if (flashAmt > 0) { flashAmt = Math.max(0, flashAmt - dt*3.5); flashEl.style.opacity = flashAmt; }
  else if (flashEl.style.opacity !== '0') flashEl.style.opacity = '0';
  sun.position.set(player.pos.x + 26, player.pos.y + 42, player.pos.z + 18);
  sun.target.position.set(player.pos.x, player.pos.y, player.pos.z);
  sun.target.updateMatrixWorld();
  skyMesh.position.copy(camera.position);
  renderer.render(scene, camera);
}

document.addEventListener('click', initAudio, { once: true });
document.addEventListener('keydown', initAudio, { once: true });

updateHPUI(); updateAmmoUI(); updateBadge(); updateKillCounter(); updateStatsUI();
animate();
</script>
</body>
