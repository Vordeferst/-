<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e14">
<title>Grenade Arena</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#000;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas { display:block; }
  #mainMenu {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, #1a2332 0%, #080c12 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; transition: opacity .4s; padding: 20px;
  }
  #mainMenu.hidden { opacity: 0; pointer-events: none; }
  .mm-title {
    font-size: clamp(32px, 8vw, 64px); font-weight: 900; letter-spacing: 6px;
    background: linear-gradient(180deg, #ffd166 0%, #ff8a2c 50%, #d63d1e 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; text-shadow: 0 0 40px rgba(255,140,40,.3);
    margin-bottom: 6px; text-align: center; line-height: 1;
  }
  .mm-subtitle { color: rgba(255,255,255,.4); font-size: 13px; letter-spacing: 4px; margin-bottom: 40px; text-transform: uppercase; text-align: center; }
  .mm-nick { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 28px; width: min(280px, 70vw); }
  .mm-nick label { font-size: 11px; letter-spacing: 3px; color: rgba(255,255,255,.5); font-weight: 700; }
  .mm-nick input { width: 100%; height: 50px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.15); border-radius: 10px; color: #fff; font-size: 16px; font-weight: 700; text-align: center; outline: none; padding: 0 14px; }
  .mm-nick input:focus { border-color: #ffb04a; background: rgba(255,176,74,.08); }
  #playBtn { width: min(280px, 70vw); height: 68px; border: none; border-radius: 14px; background: linear-gradient(180deg, #ffb04a, #d63d1e); color: #fff; font-size: 20px; font-weight: 900; letter-spacing: 4px; cursor: pointer; box-shadow: 0 8px 30px rgba(214,61,30,.5), inset 0 2px 0 rgba(255,255,255,.3); transition: transform .1s, filter .15s; }
  #playBtn:hover:not(:disabled) { filter: brightness(1.1); }
  #playBtn:active:not(:disabled) { transform: scale(.96); }
  #playBtn:disabled { background: linear-gradient(180deg, #4a4a4a, #2a2a2a); box-shadow: none; cursor: default; }
  #soloBtn { margin-top: 12px; width: min(280px, 70vw); height: 54px; border: 2px solid rgba(255,176,74,.45); border-radius: 12px; background: linear-gradient(180deg, rgba(255,176,74,.12), rgba(214,61,30,.12)); color: #ffb04a; font-size: 15px; font-weight: 900; letter-spacing: 3px; cursor: pointer; transition: transform .1s, filter .15s; }
  #soloBtn:hover:not(:disabled) { filter: brightness(1.2); }
  #soloBtn:active:not(:disabled) { transform: scale(.96); }
  #soloBtn:disabled { opacity: .4; cursor: default; }
  #menuStatus { margin-top: 22px; color: rgba(255,255,255,.55); font-size: 12px; letter-spacing: 1px; min-height: 20px; text-align: center; font-family: monospace; padding: 0 20px; }
  #menuStatus.ok { color: #6fdf6f; }
  #menuStatus.err { color: #ff6b6b; }
  .mm-footer { position: absolute; bottom: 20px; color: rgba(255,255,255,.25); font-size: 11px; letter-spacing: 2px; text-align: center; padding: 0 20px; }
  #statPanel { position: fixed; top: 16px; right: 16px; display: none; gap: 8px; align-items: center; background: linear-gradient(180deg, rgba(10,14,20,.85), rgba(5,8,12,.9)); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; padding: 6px 12px; z-index: 25; font-family: monospace; font-size: 12px; font-weight: 700; color: #fff; backdrop-filter: blur(6px); pointer-events: none; letter-spacing: .5px; }
  #statPanel.visible { display: flex; }
  #fpsText { color: #6fdf6f; } #fpsText.mid { color: #ffb04a; } #fpsText.low { color: #ff6b6b; }
  #pingText { color: #7ec8ff; } #pingText.mid { color: #ffb04a; } #pingText.bad { color: #ff6b6b; } #pingText.solo { color: #ffb04a; }
  .stat-divider { color: rgba(255,255,255,.3); }
  #killFeed { position: fixed; top: 60px; right: 16px; width: 280px; display: flex; flex-direction: column; gap: 5px; z-index: 22; pointer-events: none; }
  .kf-item { background: linear-gradient(90deg, rgba(10,14,20,.94) 0%, rgba(10,14,20,.75) 100%); border-left: 3px solid #ffb04a; padding: 7px 12px; border-radius: 4px; color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(8px); animation: kfIn .25s ease-out; box-shadow: 0 4px 12px rgba(0,0,0,.4); transition: opacity .4s; overflow: hidden; white-space: nowrap; }
  .kf-item.fade { opacity: 0; }
  .kf-killer { color: #7ec8ff; max-width: 95px; overflow: hidden; text-overflow: ellipsis; }
  .kf-victim { color: #ff8888; max-width: 95px; overflow: hidden; text-overflow: ellipsis; }
  .kf-weapon { display: inline-flex; align-items: center; flex-shrink: 0; }
  .kf-self { color: #ffd166; }
  @keyframes kfIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  #tabBtn { position: fixed; top: 16px; left: 16px; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(180deg, rgba(50,80,120,.9), rgba(20,40,80,.95)); border: 2px solid rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center; z-index: 24; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.5); transition: transform .08s; }
  #tabBtn svg { width: 30px; height: 30px; pointer-events: none; }
  #tabBtn:active { transform: scale(.92); }
  #tabBadge { position: absolute; top: -4px; right: -4px; min-width: 22px; height: 22px; border-radius: 11px; background: #ff6b35; color: #fff; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center; padding: 0 6px; box-shadow: 0 2px 6px rgba(0,0,0,.5); pointer-events: none; }
  #exitBtn { position: fixed; top: 16px; left: 84px; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(180deg, rgba(200,60,60,.92), rgba(120,20,20,.95)); border: 2px solid rgba(255,255,255,.4); display: flex; align-items: center; justify-content: center; z-index: 24; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.5); transition: transform .08s; }
  #exitBtn svg { width: 28px; height: 28px; pointer-events: none; }
  #exitBtn:active { transform: scale(.92); }
  #playerListOverlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(4px); z-index: 39; display: none; pointer-events: none; }
  #playerListOverlay.visible { display: block; }
  #playerList { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(380px, 85vw); background: linear-gradient(180deg, rgba(10,14,20,.97), rgba(5,8,12,.98)); border: 2px solid rgba(255,176,74,.45); border-radius: 14px; padding: 16px 18px; z-index: 40; backdrop-filter: blur(12px); box-shadow: 0 20px 60px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.06) inset; display: none; max-height: 70vh; overflow-y: auto; animation: plIn .15s ease-out; }
  @keyframes plIn { from { opacity: 0; transform: translate(-50%, -50%) scale(.94); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  #playerList.visible { display: block; }
  #playerList .pl-header { font-size: 12px; letter-spacing: 4px; color: rgba(255,255,255,.65); font-weight: 900; margin-bottom: 12px; text-align: center; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,.12); }
  .pl-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-radius: 8px; margin-bottom: 5px; font-size: 14px; font-weight: 700; color: #fff; background: rgba(255,255,255,.03); }
  .pl-row.pl-self { background: rgba(80,140,220,.2); color: #7ec8ff; }
  .pl-row.pl-dead { opacity: .5; }
  .pl-row .pl-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-row .pl-status { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: 10px; }
  .pl-row.pl-self .pl-status { color: #ffd166; font-size: 11px; letter-spacing: 1px; }
  .pl-room { font-size: 11px; color: rgba(255,255,255,.4); text-align: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.08); font-family: monospace; }
  #joyBase { position: fixed; left: 30px; bottom: 110px; width: 132px; height: 132px; border-radius: 50%; border: 2px solid rgba(255,255,255,.28); background: rgba(255,255,255,.05); pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 5; }
  #joyBase.active { opacity: 1; }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.75), rgba(255,255,255,.25)); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 4px 14px rgba(0,0,0,.35); transform: translate(-50%, -50%); transition: transform .05s linear; }
  #weaponBar { position: fixed; top: 50%; right: 20px; transform: translateY(-50%); display: flex; flex-direction: column; gap: 16px; z-index: 15; pointer-events: none; }
  .wslot { position: relative; width: 96px; height: 54px; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; transition: transform .15s; }
  .wslot .wicon { width: 88px; height: 46px; display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,.9)); transition: filter .18s, transform .18s; }
  .wslot.active .wicon { filter: drop-shadow(0 0 10px rgba(255,180,60,.85)) drop-shadow(0 2px 4px rgba(0,0,0,.9)); transform: scale(1.08); }
  .wslot .wkey { position: absolute; top: -6px; left: -6px; width: 20px; height: 20px; background: rgba(20,28,38,.9); border: 1px solid rgba(255,255,255,.22); border-radius: 4px; font-size: 11px; font-weight: 900; color: rgba(255,255,255,.65); display: flex; align-items: center; justify-content: center; font-family: 'Arial Black', sans-serif; transition: all .15s; }
  .wslot.active .wkey { background: rgba(255,176,74,.95); color: #000; border-color: #ffb040; }
  .wslot .wname { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); font-size: 8px; letter-spacing: 1.2px; color: rgba(255,255,255,.45); font-weight: 700; white-space: nowrap; pointer-events: none; font-family: 'Arial Black', sans-serif; }
  .wslot.active .wname { color: rgba(255,220,150,.95); }
  .wslot.disabled { opacity: 0.35; }
  #hpPanel { position: fixed; left: 16px; bottom: 16px; background: linear-gradient(180deg, rgba(18,24,32,.9), rgba(8,12,18,.92)); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 10px 16px; z-index: 15; backdrop-filter: blur(8px); min-width: 140px; }
  #hpPanel .hp-label { font-size: 9px; letter-spacing: 3px; color: rgba(255,255,255,.4); font-weight: 700; margin-bottom: 2px; }
  #hpText { font-size: 30px; font-weight: 900; color: #ff5555; line-height: 1; font-family: 'Arial Black', sans-serif; text-shadow: 0 0 12px rgba(255,60,60,.5); transition: color .2s; }
  #hpText.mid { color: #ffb04a; } #hpText.low { color: #6fdf6f; }
  #hpBar { height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  #hpFill { height: 100%; background: linear-gradient(90deg, #ff4444, #ffaa44); width: 100%; transition: width .3s ease-out; border-radius: 3px; }
  #ammoPanel { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; align-items: center; background: linear-gradient(180deg, rgba(18,24,32,.9), rgba(8,12,18,.92)); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 6px 16px; z-index: 15; backdrop-filter: blur(8px); font-family: 'Arial Black', sans-serif; user-select: none; }
  #ammoText { font-size: 22px; font-weight: 900; color: #ffd166; text-shadow: 0 0 8px rgba(255,209,102,.5); }
  #ammoText.empty { color: #ff4444; } #ammoText.reloading { color: #7ec8ff; animation: blink .6s infinite; }
  #ammoText .ammo-reserve { font-size: 15px; opacity: 0.7; font-weight: 700; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0.4; } }
  #grenadeText { display: inline-flex; align-items: center; gap: 4px; font-size: 16px; color: #ffb04a; font-weight: 700; border-left: 1px solid rgba(255,255,255,.15); padding-left: 14px; }
  #grenadeText.empty { opacity: 0.3; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,.75); box-shadow: 0 0 6px rgba(0,0,0,.6); pointer-events: none; z-index: 4; }
  #hitmarker { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 22px; font-weight: 900; opacity: 0; pointer-events: none; z-index: 4; text-shadow: 0 0 6px #000, 0 0 4px #ff4444; transition: opacity .08s; }
  #hitmarker.show { opacity: 1; }
  #damageFlash { position: fixed; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(255,0,0,.55) 100%); opacity: 0; pointer-events: none; z-index: 19; transition: opacity .25s; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 20; }
  #spectatorInfo { position: fixed; left: 50%; top: 15%; transform: translateX(-50%); background: rgba(10,14,20,.85); color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 700; letter-spacing: 1px; border: 1px solid rgba(255,255,255,.15); backdrop-filter: blur(8px); z-index: 18; display: none; text-align: center; }
  #spectatorInfo.visible { display: block; }
  #spectatorInfo .spec-killer { color: #ff8888; font-weight: 900; }
  #spectatorInfo .spec-timer { color: #ffb04a; font-size: 20px; display: block; margin-top: 4px; }
  #deathPanel { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%); background: linear-gradient(180deg, rgba(80,20,20,.94), rgba(30,8,8,.96)); border: 2px solid rgba(255,80,80,.5); border-radius: 12px; padding: 10px 20px; z-index: 17; display: none; backdrop-filter: blur(10px); text-align: center; min-width: 240px; animation: dpIn .25s ease-out; }
  #deathPanel.visible { display: block; }
  @keyframes dpIn { from { transform: translateX(-50%) translateY(15px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
  .dp-row { display: flex; align-items: center; justify-content: center; gap: 8px; color: #fff; font-size: 13px; margin-bottom: 4px; }
  .dp-label { font-size: 9px; letter-spacing: 2px; color: rgba(255,255,255,.5); font-weight: 700; }
  .dp-killer { color: #ff8888; font-weight: 900; font-size: 15px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dp-weapon-row { display: flex; align-items: center; justify-content: center; gap: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.12); }
  .dp-weapon-name { color: #ffb04a; font-weight: 700; font-size: 12px; letter-spacing: 1px; }
  #exitModal { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
  #exitModal.visible { display: flex; }
  .exit-box { background: linear-gradient(180deg, #1a2432, #0a0e14); border: 2px solid rgba(255,255,255,.15); border-radius: 16px; padding: 24px; max-width: 340px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.8); }
  .exit-box h3 { color: #fff; font-size: 18px; margin-bottom: 8px; font-weight: 900; letter-spacing: 1px; }
  .exit-box p { color: rgba(255,255,255,.6); font-size: 13px; margin-bottom: 20px; }
  .exit-actions { display: flex; gap: 10px; }
  .exit-actions button { flex: 1; height: 48px; border: none; border-radius: 10px; font-size: 14px; font-weight: 800; letter-spacing: 1.5px; cursor: pointer; transition: transform .08s; }
  #exitCancel { background: linear-gradient(180deg, #3a4554, #1e2530); color: #fff; }
  #exitConfirm { background: linear-gradient(180deg, #ff6b35, #c42a1a); color: #fff; }
  #pcHint { position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,.35); font-size: 11px; letter-spacing: 1px; z-index: 15; pointer-events: none; text-align: center; font-family: monospace; transition: opacity .5s; }
  #pcHint.fade { opacity: 0; }
  #fuseTimer { position: fixed; left: 50%; top: 58%; transform: translateX(-50%); color: #ffaa44; font-size: 22px; font-weight: 900; letter-spacing: 2px; font-family: 'Arial Black', sans-serif; text-shadow: 0 0 10px rgba(0,0,0,.9); pointer-events: none; z-index: 16; display: none; }
  #fuseTimer.visible { display: block; }
  #fuseTimer.danger { color: #ff2222; animation: fuseBlink .3s infinite; }
  @keyframes fuseBlink { 50% { opacity: 0.35; } }
</style>
</head>
<body>

<div id="mainMenu">
  <div class="mm-title">GRENADE ARENA</div>
  <div class="mm-subtitle">P2P · до 5 игроков</div>
  <div class="mm-nick">
    <label>ТВОЙ НИК</label>
    <input id="nickInput" type="text" maxlength="16" value="Player" placeholder="Player" autocomplete="off" spellcheck="false">
  </div>
  <button id="playBtn">ИГРАТЬ</button>
  <button id="soloBtn">В СОЛО</button>
  <div id="menuStatus"></div>
  <div class="mm-footer">Общая комната — все автоматически попадут в одну игру</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<div id="statPanel">
  <span id="fpsText">60 FPS</span>
  <span class="stat-divider">·</span>
  <span id="pingText">— MS</span>
</div>

<div id="killFeed"></div>

<div id="tabBtn">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="7.5" r="3.4"/>
    <path d="M3 19c0-3.4 2.7-6 6-6s6 2.6 6 6"/>
    <circle cx="17.5" cy="8.5" r="2.4"/>
    <path d="M15 19c0-2.2 1.5-4 3.4-4 .9 0 1.6.3 2.1.7"/>
  </svg>
  <span id="tabBadge">1</span>
</div>

<div id="exitBtn">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 11l9-8 9 8"/>
    <path d="M5 10v10a1 1 0 001 1h3v-6h6v6h3a1 1 0 001-1V10"/>
  </svg>
</div>

<div id="playerListOverlay"></div>
<div id="playerList">
  <div class="pl-header">ИГРОКИ</div>
  <div id="playerListContent"></div>
  <div class="pl-room" id="roomInfo">—</div>
</div>
<div id="spectatorInfo"></div>

<div id="deathPanel">
  <div class="dp-row">
    <span class="dp-label">ВАС УБИЛ</span>
    <span class="dp-killer">—</span>
  </div>
  <div class="dp-weapon-row">
    <span class="dp-weapon-icon"></span>
    <span class="dp-weapon-name">—</span>
  </div>
</div>

<div id="joyBase"><div id="joyKnob"></div></div>

<div id="hpPanel">
  <div class="hp-label">HP</div>
  <div id="hpText">100</div>
  <div id="hpBar"><div id="hpFill"></div></div>
</div>

<div id="ammoPanel">
  <div id="ammoText">12<span class="ammo-reserve">/36</span></div>
  <div id="grenadeText">
    <svg viewBox="0 0 14 14" width="14" height="14" fill="#ffb04a">
      <ellipse cx="7" cy="9" rx="4.2" ry="4.6"/>
      <rect x="6" y="1.4" width="2" height="3.2" rx="0.4"/>
      <path d="M8 3 Q10.6 1.4 9.6 5.6" stroke="#ffb04a" stroke-width="0.85" fill="none" stroke-linecap="round"/>
    </svg>
    <span id="grenadeCount">1</span>
  </div>
</div>

<div id="pcHint">ЛКМ - действие · WASD - движение · Tab - игроки · Esc - меню</div>

<div id="weaponBar">
  <div class="wslot active" id="slotPistol">
    <span class="wkey">1</span>
    <svg class="wicon" viewBox="0 0 64 40" fill="none">
      <rect x="16" y="12" width="30" height="8" rx="1" fill="#3d434b"/>
      <rect x="44" y="11" width="8" height="10" rx="1" fill="#1a1d21"/>
      <rect x="45" y="13" width="6" height="1.4" fill="#e08a2c"/>
      <rect x="45" y="17" width="6" height="1.4" fill="#e08a2c"/>
      <rect x="40" y="10" width="1.6" height="2" fill="#c9cfd4"/>
      <rect x="18" y="10" width="2.5" height="2" fill="#c9cfd4"/>
      <rect x="16" y="20" width="24" height="5" fill="#2a2e33"/>
      <rect x="18" y="20" width="20" height="1" fill="#e08a2c"/>
      <path d="M16 25 L24 25 L22 33 L17 33 Z" fill="#18191c"/>
      <line x1="17.5" y1="27" x2="22.5" y2="27" stroke="#2a2e33" stroke-width="0.7"/>
      <line x1="17.5" y1="30" x2="22.5" y2="30" stroke="#2a2e33" stroke-width="0.7"/>
      <path d="M28 25 Q34 30 30 30 L28 30" stroke="#9ca3ab" stroke-width="1.3" fill="none"/>
      <rect x="28.5" y="25" width="1" height="3" fill="#c9cfd4"/>
    </svg>
    <span class="wname">PISTOL</span>
  </div>
  <div class="wslot" id="slotKnife">
    <span class="wkey">2</span>
    <svg class="wicon" viewBox="0 0 64 40" fill="none">

function resolveWalls(pos, radius) {
  for (const w of walls) {
    if (pos.y >= w.height - 0.1) continue;
    if (pos.y + 1.7 < w.yBase) continue;
    const cx = Math.max(w.minX, Math.min(pos.x, w.maxX));
    const cz = Math.max(w.minZ, Math.min(pos.z, w.maxZ));
    const dx = pos.x - cx, dz = pos.z - cz;
    const d2 = dx*dx + dz*dz;
    if (d2 < radius*radius) {
      if (d2 > 0.0001) {
        const d = Math.sqrt(d2);
        pos.x += (dx/d) * (radius - d); pos.z += (dz/d) * (radius - d);
      } else {
        const pL = pos.x - w.minX, pR = w.maxX - pos.x;
        const pN = pos.z - w.minZ, pS = w.maxZ - pos.z;
        const m = Math.min(pL, pR, pN, pS);
        if (m === pL) pos.x = w.minX - radius;
        else if (m === pR) pos.x = w.maxX + radius;
        else if (m === pN) pos.z = w.minZ - radius;
        else pos.z = w.maxZ + radius;

    }
  }

    const cx = Math.max(w.minX, Math.min(pos.x, w.maxX));
    const cz = Math.max(w.minZ, Math.min(pos.z, w.maxZ));
    const dx = pos.x - cx, dz = pos.z - cz;
    const d2 = dx*dx + dz*dz;
    if (d2 < radius*radius && d2 > 0.0001) {

      const c1 = 1.70158, c3 = c1 + 1;
      const e = 1 + c3 * Math.pow(heldGrow - 1, 3) + c1 * Math.pow(heldGrow - 1, 2);
      held.scale.setScalar(GRENADE_SCALE * e);
      const mat = held.userData.bodyMat;
      if (mat) {
        if (grenadeHolding) {
          const remaining = Math.max(0, FUSE - grenadeHoldTime);
          if (remaining < 1.3) { const blink = Math.sin(remaining * 42) * 0.5 + 0.5; mat.emissive.setRGB(blink * 0.9, 0, 0); }
          else mat.emissive.setRGB(0, 0, 0);
        } else mat.emissive.setRGB(0, 0, 0);
      }
    }
  }
}

function updateEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) { if (effects[i](dt) === false) effects.splice(i, 1); }
}

function updatePing(dt) {
  if (!gameStarted || connections.length === 0) return;
  pingTimer -= dt;
  if (pingTimer <= 0) {
    pingTimer = 1.5; pingSeq++;
    const seq = pingSeq;
    pendingPings.set(seq, performance.now());
    sendToAll({ type: 'ping', seq });
    const s = seq;
    setTimeout(() => { if (pendingPings.has(s)) pendingPings.delete(s); }, 4000);
  }
}
function handlePingMsg(conn, data) { try { conn.send({ type: 'pong', seq: data.seq }); } catch(e) {} }
function handlePongMsg(conn, data) {
  const sentTs = pendingPings.get(data.seq);
  if (sentTs !== undefined) {
    const rtt = performance.now() - sentTs;
    pings.push(rtt);
    if (pings.length > 6) pings.shift();
    pendingPings.delete(data.seq);
    measuredPing = Math.round(pings.reduce((a,b)=>a+b,0) / pings.length);
  }
}

function handleNetworkData(conn, data) {
  if (!data || !data.type) return;
  switch (data.type) {
    case 'ping': handlePingMsg(conn, data); break;
    case 'pong': handlePongMsg(conn, data); break;
    case 'state':
      if (data.from === myId || deadPeers.has(data.from)) break;
      applyPlayerSnapshot(data);
      if (playerListOpen) updatePlayerList();
      break;
    case 'shoot': {
      if (!data.pos) break;
      const pos = new THREE.Vector3().fromArray(data.pos);
      const dist = player.pos.distanceTo(pos);
      const vol = Math.max(0.08, Math.min(1.0, 1 - dist / 35));
      playShootSound(vol * 0.75);
      spawnMuzzleFlash(pos);
      break;
    }
    case 'grenade': {
      if (!data.pos || !data.vel) break;
      const pos = new THREE.Vector3().fromArray(data.pos);
      const vel = new THREE.Vector3().fromArray(data.vel);
      const g = createGrenade(); g.position.copy(pos); scene.add(g);
      let fuse = data.fuse !== undefined ? data.fuse : FUSE;
      effects.push(dt => {
        fuse -= dt; vel.y -= GRAVITY * dt;
        g.position.addScaledVector(vel, dt);
        g.rotation.x += 3 * dt; g.rotation.y += 4 * dt;
        grenadeWallCollide(g.position, vel, 0.11);
        if (g.position.y < 0.11) {
          g.position.y = 0.11;
          if (vel.y < -0.6) { vel.y *= -0.4; vel.x *= 0.72; vel.z *= 0.72; }
          else { vel.y = 0; const fr = Math.max(0, 1 - 3.2*dt); vel.x *= fr; vel.z *= fr; }
        }
        if (fuse <= 0) { const p = g.position.clone(); scene.remove(g); disposeGroup(g); explode(p); return false; }
        return true;
      });
      break;
    }
    case 'damaged':
      if (data.target === myId) applyDamageToSelf(data.amount, data.from, data.weapon);
      break;
    case 'died':
      if (data.victim === myId) break;
      if (deadPeers.has(data.victim)) break;
      deadPeers.add(data.victim);
      addKillFeed(data.killerName || '?', data.victimName || '?', data.weapon);
      if (data.killer === myId) playKillSound();
      {
        const rp = remotePlayers.get(data.victim);
        if (rp) rp.visible = false;
      }
      if (playerListOpen) updatePlayerList();
      break;
    case 'respawned':
      if (data.from === myId) break;
      deadPeers.delete(data.from);
      {
        const rp = remotePlayers.get(data.from);
        if (rp) rp.visible = true;
      }
      if (playerListOpen) updatePlayerList();
      break;
  }
}

function setupConnHandlers(conn) {
  conn.on('data', (data) => {
    handleNetworkData(conn, data);
    if (isHost && data && data.type && data.type !== 'ping' && data.type !== 'pong') relayToOthers(conn, data);
  });
  conn.on('close', () => {
    const idx = connections.indexOf(conn);
    if (idx >= 0) connections.splice(idx, 1);
    if (!isHost && gameStarted) { returnToMenu('Хост отключился'); return; }
    const rp = remotePlayers.get(conn.peer);
    if (rp) { scene.remove(rp); disposeGroup(rp); remotePlayers.delete(conn.peer); }
    deadPeers.delete(conn.peer); peerNames.delete(conn.peer);
    updateBadge();
    if (playerListOpen) updatePlayerList();
  });
  conn.on('error', () => {});
}

function setupAsHost() {
  if (hostHandlerBound) return;
  hostHandlerBound = true;
  peer.on('connection', (conn) => {
    conn.on('open', () => {
      if (connections.length >= MAX_PLAYERS - 1) {
        try { conn.send({ type: 'full' }); } catch(e) {}
        setTimeout(() => { try { conn.close(); } catch(e) {} }, 200);
        return;
      }
      const players = [];
      players.push({ from: myId, name: myName, pos: player.pos.toArray(), yaw: player.yaw });
      for (const [peerId, rp] of remotePlayers) {
        players.push({ from: peerId, name: peerNames.get(peerId) || 'Игрок', pos: rp.position.toArray(), yaw: rp.rotation.y });
      }
      try { conn.send({ type: 'joined', players }); } catch(e) {}
      connections.push(conn);
      setupConnHandlers(conn);
      try { conn.send({ type: 'state', from: myId, name: myName, pos: player.pos.toArray(), yaw: player.yaw, pitch: player.pitch }); } catch(e) {}
      updateBadge();
    });
  });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch(e) {} });
  peer.on('error', () => {});
}

/* === Стать хостом === */
function tryHost(serverIdx) {
  return new Promise((resolve) => {
    let done = false;
    const opts = PEER_HOSTS[serverIdx];
    let p;
    try { p = new Peer(ROOM_ID, opts); } catch(e) { resolve({ ok: false, reason: 'error', err: e }); return; }
    const finish = (r) => {
      if (done) return; done = true;
      if (!r.ok) { try { p.destroy(); } catch(e) {} }
      resolve(r);
    };
    const timeout = setTimeout(() => finish({ ok: false, reason: 'timeout' }), 9000);
    p.on('open', () => {
      clearTimeout(timeout);
      peer = p; isHost = true; myId = ROOM_ID;
      hostHandlerBound = false;
      setupAsHost();
      finish({ ok: true, reason: 'hosted' });
    });
    p.on('error', (err) => {
      clearTimeout(timeout);
      if (err.type === 'unavailable-id') finish({ ok: false, reason: 'taken' });
      else finish({ ok: false, reason: 'error', err });
    });
  });
}

/* === Подключиться клиентом === */
function tryJoin(serverIdx) {
  return new Promise((resolve) => {
    let done = false;
    const opts = PEER_HOSTS[serverIdx];
    let p;
    try { p = new Peer(null, opts); } catch(e) { resolve({ ok: false, reason: 'error', err: e }); return; }
    const finish = (r) => {
      if (done) return; done = true;
      clearTimeout(timeout);
      if (!r.ok) { try { p.destroy(); } catch(e) {} }
      resolve(r);
    };
    const timeout = setTimeout(() => finish({ ok: false, reason: 'timeout' }), 18000);

    p.on('open', () => {
      try {
        const conn = p.connect(ROOM_ID, { reliable: true });
        conn.on('open', () => {});
        conn.on('data', (data) => {
          if (data.type === 'joined') {
            peer = p; isHost = false; myId = p.id;
            connections.push(conn);
            setupConnHandlers(conn);
            p.on('disconnected', () => { try { p.reconnect(); } catch(e) {} });
            if (data.players && Array.isArray(data.players)) {
              for (const pd of data.players) applyPlayerSnapshot(pd);
            }
            updateBadge();
            try { conn.send({ type: 'state', from: myId, name: myName, pos: player.pos.toArray(), yaw: player.yaw, pitch: player.pitch }); } catch(e) {}
            finish({ ok: true, reason: 'joined' });
          } else if (data.type === 'full') finish({ ok: false, reason: 'full' });
        });
        conn.on('close', () => finish({ ok: false, reason: 'closed' }));
        conn.on('error', () => finish({ ok: false, reason: 'error' }));
      } catch(e) { finish({ ok: false, reason: 'error', err: e }); }
    });
    p.on('error', (err) => {
      if (err.type === 'peer-unavailable') finish({ ok: false, reason: 'unavailable' });
      else finish({ ok: false, reason: 'error', err });
    });
  });
}

/* === ГЛАВНОЕ: авто-подключение к общей комнате === */
async function autoConnect() {
  if (connectInProgress) return;
  connectInProgress = true;
  playBtn.disabled = true; soloBtn.disabled = true;

  for (let attempt = 0; attempt < 6; attempt++) {
    const sj = serverIndex % PEER_HOSTS.length;
    const sh = serverIndex % PEER_HOSTS.length;
    serverIndex++;

    // 1) Пробуем подключиться к хосту
    setMenuStatus(`Подключение... (попытка ${attempt + 1}/6)`);
    const joinRes = await tryJoin(sj);
    if (joinRes.ok) {
      setMenuStatus('Подключено!', 'ok');
      launchGame();
      connectInProgress = false;
      return;
    }
    if (joinRes.reason === 'full') {
      setMenuStatus('Комната заполнена (5 игроков макс.)', 'err');
      connectInProgress = false;
      playBtn.disabled = false; soloBtn.disabled = false;
      return;
    }

    // 2) Комната пуста — становимся хостом
    if (joinRes.reason === 'unavailable' || joinRes.reason === 'closed' || joinRes.reason === 'timeout' || joinRes.reason === 'error') {
      setMenuStatus(`Создаём комнату... (попытка ${attempt + 1}/6)`);
      const hostRes = await tryHost(sh);
      if (hostRes.ok) {
        setMenuStatus('Комната создана! Ждём игроков...', 'ok');
        launchGame();
        connectInProgress = false;
        return;
      }
      // taken = кто-то успел — повторим join в следующей итерации
      if (hostRes.reason === 'taken') continue;
      // timeout/error — смена сервера, ещё попытка
      await new Promise(r => setTimeout(r, 400));
      continue;
    }
  }

  setMenuStatus('Не удалось подключиться. Проверьте интернет и попробуйте ещё раз', 'err');
  connectInProgress = false;
  playBtn.disabled = false; soloBtn.disabled = false;
}

function launchGame() {
  myRoomId = ROOM_ID;
  mainMenu.classList.add('hidden');
  gameStarted = true;
  statPanelEl.classList.add('visible');
  pcHintEl.textContent = 'ЛКМ - действие · WASD - движение · Tab - игроки · Esc - меню';
  pcHintEl.classList.remove('fade');
  const sp = pickSpawn(null);
  player.pos.set(sp.x, 0, sp.z);
  player.yaw = faceCenter(sp);
  player.pitch = 0;
  ammoInMag = MAG_SIZE; reserveAmmo = RESERVE_MAX; grenadesLeft = INITIAL_GRENADES;
  updateHPUI(); updateAmmoUI(); updateBadge();
  // Всегда светлая тема для общей комнаты
  scene.background.setHex(0xa5cbe8);
  setTimeout(() => lockPointer(), 300);
  setTimeout(() => pcHintEl.classList.add('fade'), 6000);
}

function startSolo() {
  initAudio();
  myName = nickInput.value.trim() || 'Player';
  localStorage.setItem('grenade-nick', myName);
  soloMode = true;
  myRoomId = null;
  playBtn.disabled = true; soloBtn.disabled = true;
  mainMenu.classList.add('hidden');
  gameStarted = true;
  statPanelEl.classList.add('visible');
  pcHintEl.textContent = 'СОЛО РЕЖИМ · Исследуй карту · Tab - игроки · Esc - меню';
  pcHintEl.classList.remove('fade');
  const sp = pickSpawn(null);
  player.pos.set(sp.x, 0, sp.z);
  player.yaw = faceCenter(sp);
  player.pitch = 0;
  ammoInMag = MAG_SIZE; reserveAmmo = RESERVE_MAX; grenadesLeft = INITIAL_GRENADES;
  updateHPUI(); updateAmmoUI(); updateBadge();
  setTimeout(() => lockPointer(), 300);
  setTimeout(() => pcHintEl.classList.add('fade'), 6000);
}

function returnToMenu(reason) {
  gameStarted = false;
  soloMode = false;
  connectInProgress = false;
  releasePointer();
  setPlayerListOpen(false);
  for (const [, rp] of remotePlayers) { scene.remove(rp); disposeGroup(rp); }
  remotePlayers.clear(); peerNames.clear(); deadPeers.clear(); connections.length = 0;
  hostHandlerBound = false;
  if (peer) { try { peer.destroy(); } catch(e) {} peer = null; }
  myId = null; isHost = false;
  myHP = 100; isDead = false;
  ammoInMag = MAG_SIZE; reserveAmmo = RESERVE_MAX; isReloading = false; grenadesLeft = INITIAL_GRENADES;
  knifeAnimT = -1; camKickPitch = 0; camKickYaw = 0;
  cancelGrenadeHold();
  measuredPing = 0; pings = []; pendingPings.clear();
  fuseTimerEl.classList.remove('visible', 'danger');
  spectatorInfoEl.classList.remove('visible');
  hideDeathPanel();
  pcHintEl.textContent = 'ЛКМ - действие · WASD - движение · Tab - игроки · Esc - меню';
  pcHintEl.classList.remove('fade');
  statPanelEl.classList.remove('visible');
  updateHPUI(); updateAmmoUI(); updateBadge();
  mainMenu.classList.remove('hidden');
  playBtn.disabled = false; soloBtn.disabled = false;
  setMenuStatus(reason || '', 'err');
}

nickInput.value = localStorage.getItem('grenade-nick') || 'Player';
nickInput.addEventListener('input', () => localStorage.setItem('grenade-nick', nickInput.value));

playBtn.addEventListener('click', () => {
  initAudio();
  myName = nickInput.value.trim() || 'Player';
  localStorage.setItem('grenade-nick', myName);
  autoConnect();
});
soloBtn.addEventListener('click', () => {
  initAudio();
  myName = nickInput.value.trim() || 'Player';
  localStorage.setItem('grenade-nick', myName);
  startSolo();
});

let stateSendTimer = 0;
function updateNetwork(dt) {
  if (!gameStarted || connections.length === 0 || !myId || isDead) return;
  stateSendTimer -= dt;
  if (stateSendTimer <= 0) {
    stateSendTimer = 0.1;
    sendToAll({ type: 'state', from: myId, name: myName, pos: player.pos.toArray(), yaw: player.yaw, pitch: player.pitch });
  }
}

const slotPistol = document.getElementById('slotPistol');
const slotKnife = document.getElementById('slotKnife');
const slotGrenade = document.getElementById('slotGrenade');

function selectWeapon(w) {
  if (currentWeapon === 'knife' && w !== 'knife') {
    knifeAnimT = -1;
    knifeGroup.position.copy(KNIFE_IDLE_POS);
    knifeGroup.rotation.copy(KNIFE_IDLE_ROT);
  }
  if (currentWeapon === 'grenade' && w !== 'grenade') cancelGrenadeHold();
  currentWeapon = w;
  firingHeld = false;
  slotPistol.classList.remove('active'); slotKnife.classList.remove('active'); slotGrenade.classList.remove('active');
  pistolGroup.visible = false; knifeGroup.visible = false; heldGrenadeGroup.visible = false;
  if (w === 'pistol') { pistolGroup.visible = !isDead; slotPistol.classList.add('active'); }
  else if (w === 'knife') { knifeGroup.visible = !isDead; slotKnife.classList.add('active'); }
  else if (w === 'grenade') {
    heldGrenadeGroup.visible = !isDead;
    slotGrenade.classList.add('active');
    slotGrenade.classList.toggle('disabled', grenadesLeft === 0);
    if (!held && !flying && grenadesLeft > 0) spawnHeldGrenade();
  }
  updateAmmoUI();
}
slotPistol.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (gameStarted && !isDead) selectWeapon('pistol'); });
slotKnife.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (gameStarted && !isDead) selectWeapon('knife'); });
slotGrenade.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (gameStarted && !isDead) selectWeapon('grenade'); });

const keys = {};
const JOY_R = 62;
function updateJoyIndicator() {
  if (!gameStarted || isDead) { joyBaseEl.classList.remove('active'); return; }
  const mag = Math.hypot(joy.x, joy.y);
  if (mag > 0.01) {
    joyBaseEl.classList.add('active');
    const dx = joy.x * JOY_R; const dy = -joy.y * JOY_R;
    joyKnobEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  } else { joyBaseEl.classList.remove('active'); joyKnobEl.style.transform = 'translate(-50%, -50%)'; }
}

window.addEventListener('keydown', e => {
  if (!gameStarted) return;
  if (e.code === 'Tab') { e.preventDefault(); setPlayerListOpen(true); return; }
  if (e.code === 'Escape') {
    if (!exitModal.classList.contains('visible')) {
      exitModal.classList.add('visible');
      if (document.pointerLockElement) { intentionalUnlock = true; document.exitPointerLock(); }
    }
    return;
  }
  if (e.code === 'Space') { e.preventDefault(); jump(); return; }
  if (e.code === 'KeyR') { e.preventDefault(); startReload(); return; }
  if (e.code === 'KeyG') {
    e.preventDefault();
    if (currentWeapon === 'grenade') throwGrenade();
    else if (grenadesLeft > 0) { selectWeapon('grenade'); throwGrenade(); }
    return;
  }
  if (e.code === 'Digit1') selectWeapon('pistol');
  if (e.code === 'Digit2') selectWeapon('knife');
  if (e.code === 'Digit3') selectWeapon('grenade');
  keys[e.code] = true;
});
window.addEventListener('keyup', e => {
  if (!gameStarted) return;
  if (e.code === 'Tab') { e.preventDefault(); setPlayerListOpen(false); return; }
  keys[e.code] = false;
});

function keyboardMove() {
  if (!gameStarted || isDead) { joy.x = 0; joy.y = 0; return; }
  let kx = 0, ky = 0;
  if (keys['KeyW'] || keys['ArrowUp']) ky += 1;
  if (keys['KeyS'] || keys['ArrowDown']) ky -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) kx += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) kx -= 1;
  if (kx || ky) { const l = Math.hypot(kx, ky); joy.x = kx/l; joy.y = ky/l; }
  else { joy.x = 0; joy.y = 0; }
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

const clock = new THREE.Clock();
let playerListTick = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime;

  fpsFrames++; fpsTimer += dt;
  if (fpsTimer >= 0.5) { currentFPS = Math.round(fpsFrames / fpsTimer); fpsFrames = 0; fpsTimer = 0; }
  statsUpdateTimer += dt;
  if (statsUpdateTimer >= 0.5) { statsUpdateTimer = 0; updateStatsUI(); }

  if (fireTimer > 0) fireTimer -= dt;
  if (firingHeld && currentWeapon === 'pistol' && !isReloading && ammoInMag > 0 && !isDead && pointerLocked) shoot();
  keyboardMove();
  updateJoyIndicator();
  updatePlayer(dt);
  updateWeapon(dt);
  updateGrenade(dt);
  updateEffects(dt);
  updateNetwork(dt);
  updatePing(dt);

  if (grenadeHolding) {
    grenadeHoldTime += dt;
    const remaining = Math.max(0, FUSE - grenadeHoldTime);
    fuseTimerEl.textContent = remaining.toFixed(1) + 's';
    fuseTimerEl.classList.add('visible');
    fuseTimerEl.classList.toggle('danger', remaining < 1.3);
    if (remaining < 1.3) {
      fuseBeepTimer -= dt;
      if (fuseBeepTimer <= 0) {
        playFuseBeep(0.9);
        fuseBeepTimer = 0.12 + Math.max(0.12, remaining / 1.3) * 0.3;
      }
    }
    if (grenadeHoldTime >= FUSE) {
      grenadeHolding = false; grenadeHoldTime = 0;
      fuseTimerEl.classList.remove('visible', 'danger');
      explodeGrenadeInHand();
    }
  } else {
    fuseTimerEl.classList.remove('visible', 'danger');
  }

  if (gameStarted && !isDead && moving > 0.25 && isGrounded) {
    footstepTimer -= dt;
    if (footstepTimer <= 0) {
      playFootstepSound(0.9);
      footstepTimer = 0.36 - moving * 0.06 + Math.random() * 0.04;
    }
  } else {
    footstepTimer = 0;
  }

  if (isDead) {
    const specTimer = document.getElementById('specTimer');
    if (specTimer) specTimer.textContent = Math.ceil(deathTimer);
  }
  playerListTick += dt;
  if (playerListTick > 1 && playerListOpen) { playerListTick = 0; updatePlayerList(); }

  if (shake > 0) {
    shake = Math.max(0, shake - dt * 2.4);
    const s = shake * shake * 0.22;
    camera.position.x += (Math.random() - 0.5) * s;
    camera.position.y += (Math.random() - 0.5) * s;
    camera.position.z += (Math.random() - 0.5) * s;
    camera.rotation.z = (Math.random() - 0.5) * s * 0.35;
  } else camera.rotation.z = 0;
  if (flashAmt > 0) {
    flashAmt = Math.max(0, flashAmt - dt * 2.6);
    flashEl.style.opacity = flashAmt;
  } else if (flashEl.style.opacity !== '0') flashEl.style.opacity = '0';
  sun.position.set(player.pos.x + 26, 42, player.pos.z + 18);
  sun.target.position.set(player.pos.x, 0, player.pos.z);
  sun.target.updateMatrixWorld();
  renderer.render(scene, camera);
}

document.addEventListener('click', initAudio, { once: true });
document.addEventListener('keydown', initAudio, { once: true });

selectWeapon('pistol');
updateHPUI();
updateAmmoUI();
updateBadge();
updateStatsUI();
animate();
</script>
