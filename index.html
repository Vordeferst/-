<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e14">
<title>Grenade Arena</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#000;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas { display:block; }
  #mainMenu {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, #1a2332 0%, #080c12 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; transition: opacity .4s; padding: 20px; overflow-y: auto;
  }
  #mainMenu.hidden { opacity: 0; pointer-events: none; }
  .mm-title {
    font-size: clamp(28px, 7vw, 56px); font-weight: 900; letter-spacing: 6px;
    background: linear-gradient(180deg, #ffd166 0%, #ff8a2c 50%, #d63d1e 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; text-shadow: 0 0 40px rgba(255,140,40,.3);
    margin-bottom: 6px; text-align: center; line-height: 1;
  }
  .mm-subtitle {
    color: rgba(255,255,255,.4); font-size: 12px; letter-spacing: 4px;
    margin-bottom: 24px; text-transform: uppercase; text-align: center;
  }
  .mm-nick { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 14px; width: min(280px, 70vw); }
  .mm-nick label { font-size: 11px; letter-spacing: 3px; color: rgba(255,255,255,.5); font-weight: 700; }
  .mm-nick input {
    width: 100%; height: 46px; background: rgba(255,255,255,.08);
    border: 2px solid rgba(255,255,255,.15); border-radius: 10px; color: #fff;
    font-size: 15px; font-weight: 700; text-align: center; outline: none; padding: 0 14px;
  }
  .mm-nick input:focus { border-color: #ffb04a; background: rgba(255,176,74,.08); }
  #roomCodeInput {
    text-transform: uppercase;
    letter-spacing: 6px;
    font-family: monospace;
    font-size: 18px !important;
  }
  #playBtn {
    width: min(280px, 70vw); height: 60px; border: none; border-radius: 14px;
    background: linear-gradient(180deg, #ffb04a, #d63d1e);
    color: #fff; font-size: 18px; font-weight: 900; letter-spacing: 4px;
    cursor: pointer; box-shadow: 0 8px 30px rgba(214,61,30,.5), inset 0 2px 0 rgba(255,255,255,.3);
    transition: transform .1s, filter .15s;
  }
  #playBtn:hover:not(:disabled) { filter: brightness(1.1); }
  #playBtn:active:not(:disabled) { transform: scale(.96); }
  #playBtn:disabled { background: linear-gradient(180deg, #4a4a4a, #2a2a2a); box-shadow: none; cursor: default; }
  #createBtn {
    margin-top: 10px;
    width: min(280px, 70vw); height: 50px;
    border: 2px solid rgba(126,200,255,.5); border-radius: 12px;
    background: linear-gradient(180deg, rgba(126,200,255,.12), rgba(60,120,200,.12));
    color: #7ec8ff; font-size: 14px; font-weight: 900; letter-spacing: 3px;
    cursor: pointer; transition: transform .1s, filter .15s, background .15s;
  }
  #createBtn:hover:not(:disabled) { filter: brightness(1.2); background: linear-gradient(180deg, rgba(126,200,255,.25), rgba(60,120,200,.25)); }
  #createBtn:active:not(:disabled) { transform: scale(.96); }
  #createBtn:disabled { opacity: .4; cursor: default; }
  #soloBtn {
    margin-top: 10px;
    width: min(280px, 70vw); height: 44px;
    border: 2px solid rgba(255,176,74,.35); border-radius: 12px;
    background: linear-gradient(180deg, rgba(255,176,74,.08), rgba(214,61,30,.08));
    color: #ffb04a; font-size: 13px; font-weight: 900; letter-spacing: 3px;
    cursor: pointer; transition: transform .1s, filter .15s, background .15s;
  }
  #soloBtn:hover:not(:disabled) { filter: brightness(1.2); background: linear-gradient(180deg, rgba(255,176,74,.2), rgba(214,61,30,.2)); }
  #soloBtn:active:not(:disabled) { transform: scale(.96); }
  #soloBtn:disabled { opacity: .4; cursor: default; }
  #menuStatus { margin-top: 16px; color: rgba(255,255,255,.55); font-size: 12px; letter-spacing: 1px; min-height: 20px; text-align: center; font-family: monospace; padding: 0 20px; max-width: 90vw; word-break: break-word; }
  #menuStatus.ok { color: #6fdf6f; }
  #menuStatus.err { color: #ff6b6b; }
  #menuStatus.code { color: #ffd166; font-size: 22px; letter-spacing: 6px; font-weight: 900; }
  .mm-footer { position: relative; margin-top: 18px; color: rgba(255,255,255,.25); font-size: 10px; letter-spacing: 2px; text-align: center; padding: 0 20px; }

  #statPanel {
    position: fixed; top: 16px; right: 16px;
    display: none; gap: 8px; align-items: center;
    background: linear-gradient(180deg, rgba(10,14,20,.85), rgba(5,8,12,.9));
    border: 1px solid rgba(255,255,255,.12); border-radius: 8px;
    padding: 6px 12px; z-index: 25;
    font-family: monospace; font-size: 12px; font-weight: 700; color: #fff;
    backdrop-filter: blur(6px); box-shadow: 0 2px 8px rgba(0,0,0,.4);
    pointer-events: none; letter-spacing: .5px;
  }
  #statPanel.visible { display: flex; }
  #fpsText { color: #6fdf6f; }
  #fpsText.mid { color: #ffb04a; }
  #fpsText.low { color: #ff6b6b; }
  #pingText { color: #7ec8ff; }
  #pingText.mid { color: #ffb04a; }
  #pingText.bad { color: #ff6b6b; }
  #pingText.solo { color: #ffb04a; }
  .stat-divider { color: rgba(255,255,255,.3); }

  #killFeed { position: fixed; top: 60px; right: 16px; width: 280px; display: flex; flex-direction: column; gap: 5px; z-index: 22; pointer-events: none; }
  .kf-item {
    background: linear-gradient(90deg, rgba(10,14,20,.94) 0%, rgba(10,14,20,.75) 100%);
    border-left: 3px solid #ffb04a; padding: 7px 12px; border-radius: 4px;
    color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px;
    backdrop-filter: blur(8px); animation: kfIn .25s ease-out; box-shadow: 0 4px 12px rgba(0,0,0,.4);
    transition: opacity .4s; overflow: hidden; white-space: nowrap;
  }
  .kf-item.fade { opacity: 0; }
  .kf-killer { color: #7ec8ff; max-width: 95px; overflow: hidden; text-overflow: ellipsis; }
  .kf-victim { color: #ff8888; max-width: 95px; overflow: hidden; text-overflow: ellipsis; }
  .kf-weapon { display: inline-flex; align-items: center; flex-shrink: 0; }
  .kf-self { color: #ffd166; }
  @keyframes kfIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  #tabBtn {
    position: fixed; top: 16px; left: 16px; width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(180deg, rgba(50,80,120,.9), rgba(20,40,80,.95));
    border: 2px solid rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center;
    z-index: 24; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.5); transition: transform .08s;
  }
  #tabBtn svg { width: 30px; height: 30px; pointer-events: none; }
  #tabBtn:active { transform: scale(.92); }
  #tabBadge {
    position: absolute; top: -4px; right: -4px; min-width: 22px; height: 22px; border-radius: 11px;
    background: #ff6b35; color: #fff; font-size: 12px; font-weight: 900;
    display: flex; align-items: center; justify-content: center; padding: 0 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,.5); pointer-events: none;
  }
  #exitBtn {
    position: fixed; top: 16px; left: 84px; width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(180deg, rgba(200,60,60,.92), rgba(120,20,20,.95));
    border: 2px solid rgba(255,255,255,.4); display: flex; align-items: center; justify-content: center;
    z-index: 24; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.5); transition: transform .08s;
  }
  #exitBtn svg { width: 28px; height: 28px; pointer-events: none; }
  #exitBtn:active { transform: scale(.92); }

  #playerListOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    backdrop-filter: blur(4px); z-index: 39; display: none; pointer-events: none;
  }
  #playerListOverlay.visible { display: block; }
  #playerList {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(380px, 85vw);
    background: linear-gradient(180deg, rgba(10,14,20,.97), rgba(5,8,12,.98));
    border: 2px solid rgba(255,176,74,.45);
    border-radius: 14px;
    padding: 16px 18px; z-index: 40;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.06) inset;
    display: none; max-height: 70vh; overflow-y: auto;
    animation: plIn .15s ease-out;
  }
  @keyframes plIn {
    from { opacity: 0; transform: translate(-50%, -50%) scale(.94); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  #playerList.visible { display: block; }
  #playerList .pl-header {
    font-size: 12px; letter-spacing: 4px; color: rgba(255,255,255,.65);
    font-weight: 900; margin-bottom: 12px; text-align: center;
    padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,.12);
  }
  .pl-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 12px; border-radius: 8px; margin-bottom: 5px;
    font-size: 14px; font-weight: 700; color: #fff;
    background: rgba(255,255,255,.03);
  }
  .pl-row.pl-self { background: rgba(80,140,220,.2); color: #7ec8ff; }
  .pl-row.pl-dead { opacity: .5; }
  .pl-row .pl-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-row .pl-status { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: 10px; }
  .pl-row.pl-self .pl-status { color: #ffd166; font-size: 11px; letter-spacing: 1px; }
  .pl-room {
    font-size: 11px; color: rgba(255,255,255,.4); text-align: center;
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,.08); font-family: monospace;
  }

  #joyBase { position: fixed; left: 30px; bottom: 110px; width: 132px; height: 132px; border-radius: 50%; border: 2px solid rgba(255,255,255,.28); background: rgba(255,255,255,.05); pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 5; }
  #joyBase.active { opacity: 1; }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.75), rgba(255,255,255,.25)); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 4px 14px rgba(0,0,0,.35); transform: translate(-50%, -50%); transition: transform .05s linear; }
  #weaponBar { position: fixed; top: 50%; right: 20px; transform: translateY(-50%); display: flex; flex-direction: column; gap: 16px; z-index: 15; pointer-events: none; }
  .wslot { position: relative; width: 96px; height: 54px; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; transition: transform .15s; }
  .wslot .wicon { width: 88px; height: 46px; display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,.9)) drop-shadow(0 1px 2px rgba(0,0,0,.8)); transition: filter .18s, transform .18s; }
  .wslot.active .wicon { filter: drop-shadow(0 0 10px rgba(255,180,60,.85)) drop-shadow(0 2px 4px rgba(0,0,0,.9)); transform: scale(1.08); }
  .wslot .wkey { position: absolute; top: -6px; left: -6px; width: 20px; height: 20px; background: rgba(20,28,38,.9); border: 1px solid rgba(255,255,255,.22); border-radius: 4px; font-size: 11px; font-weight: 900; color: rgba(255,255,255,.65); display: flex; align-items: center; justify-content: center; font-family: 'Arial Black', sans-serif; transition: all .15s; }
  .wslot.active .wkey { background: rgba(255,176,74,.95); color: #000; border-color: #ffb040; box-shadow: 0 0 8px rgba(255,176,74,.7); }
  .wslot .wname { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); font-size: 8px; letter-spacing: 1.2px; color: rgba(255,255,255,.45); font-weight: 700; white-space: nowrap; pointer-events: none; font-family: 'Arial Black', sans-serif; }
  .wslot.active .wname { color: rgba(255,220,150,.95); }
  .wslot.disabled { opacity: 0.35; }
  #hpPanel { position: fixed; left: 16px; bottom: 16px; background: linear-gradient(180deg, rgba(18,24,32,.9), rgba(8,12,18,.92)); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 10px 16px; z-index: 15; backdrop-filter: blur(8px); box-shadow: 0 6px 20px rgba(0,0,0,.5); min-width: 140px; }
  #hpPanel .hp-label { font-size: 9px; letter-spacing: 3px; color: rgba(255,255,255,.4); font-weight: 700; margin-bottom: 2px; }
  #hpText { font-size: 30px; font-weight: 900; color: #ff5555; line-height: 1; font-family: 'Arial Black', sans-serif; text-shadow: 0 0 12px rgba(255,60,60,.5); transition: color .2s; }
  #hpText.mid { color: #ffb04a; text-shadow: 0 0 12px rgba(255,176,74,.5); }
  #hpText.low { color: #6fdf6f; text-shadow: 0 0 12px rgba(111,223,111,.5); }
  #hpBar { height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  #hpFill { height: 100%; background: linear-gradient(90deg, #ff4444, #ffaa44); width: 100%; transition: width .3s ease-out, background .3s; border-radius: 3px; }
  #ammoPanel { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; align-items: center; background: linear-gradient(180deg, rgba(18,24,32,.9), rgba(8,12,18,.92)); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 6px 16px; z-index: 15; backdrop-filter: blur(8px); box-shadow: 0 6px 20px rgba(0,0,0,.5); font-family: 'Arial Black', sans-serif; user-select: none; }
  #ammoText { font-size: 22px; font-weight: 900; color: #ffd166; text-shadow: 0 0 8px rgba(255,209,102,.5); }
  #ammoText.empty { color: #ff4444; } #ammoText.reloading { color: #7ec8ff; animation: blink .6s infinite; }
  #ammoText .ammo-reserve { font-size: 15px; opacity: 0.7; font-weight: 700; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0.4; } }
  #grenadeText { display: inline-flex; align-items: center; gap: 4px; font-size: 16px; color: #ffb04a; font-weight: 700; border-left: 1px solid rgba(255,255,255,.15); padding-left: 14px; }
  #grenadeText.empty { opacity: 0.3; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,.75); box-shadow: 0 0 6px rgba(0,0,0,.6); pointer-events: none; z-index: 4; }
  #hitmarker { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 22px; font-weight: 900; opacity: 0; pointer-events: none; z-index: 4; text-shadow: 0 0 6px #000, 0 0 4px #ff4444; transition: opacity .08s; }
  #hitmarker.show { opacity: 1; }
  #damageFlash { position: fixed; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(255,0,0,.55) 100%); opacity: 0; pointer-events: none; z-index: 19; transition: opacity .25s; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 20; }
  #spectatorInfo { position: fixed; left: 50%; top: 15%; transform: translateX(-50%); background: rgba(10,14,20,.85); color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 700; letter-spacing: 1px; border: 1px solid rgba(255,255,255,.15); backdrop-filter: blur(8px); z-index: 18; display: none; text-align: center; }
  #spectatorInfo.visible { display: block; }
  #spectatorInfo .spec-killer { color: #ff8888; font-weight: 900; }
  #spectatorInfo .spec-timer { color: #ffb04a; font-size: 20px; display: block; margin-top: 4px; }
  #deathPanel { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%); background: linear-gradient(180deg, rgba(80,20,20,.94), rgba(30,8,8,.96)); border: 2px solid rgba(255,80,80,.5); border-radius: 12px; padding: 10px 20px; z-index: 17; display: none; backdrop-filter: blur(10px); box-shadow: 0 8px 28px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08); text-align: center; min-width: 240px; animation: dpIn .25s ease-out; }
  #deathPanel.visible { display: block; }
  @keyframes dpIn { from { transform: translateX(-50%) translateY(15px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
  .dp-row { display: flex; align-items: center; justify-content: center; gap: 8px; color: #fff; font-size: 13px; margin-bottom: 4px; }
  .dp-label { font-size: 9px; letter-spacing: 2px; color: rgba(255,255,255,.5); font-weight: 700; }
  .dp-killer { color: #ff8888; font-weight: 900; font-size: 15px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dp-weapon-row { display: flex; align-items: center; justify-content: center; gap: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.12); }
  .dp-weapon-icon svg { display: block; }
  .dp-weapon-name { color: #ffb04a; font-weight: 700; font-size: 12px; letter-spacing: 1px; }
  #exitModal { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
  #exitModal.visible { display: flex; }
  .exit-box { background: linear-gradient(180deg, #1a2432, #0a0e14); border: 2px solid rgba(255,255,255,.15); border-radius: 16px; padding: 24px; max-width: 340px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.8); animation: modalIn .2s ease-out; }
  @keyframes modalIn { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .exit-box h3 { color: #fff; font-size: 18px; margin-bottom: 8px; font-weight: 900; letter-spacing: 1px; }
  .exit-box p { color: rgba(255,255,255,.6); font-size: 13px; margin-bottom: 20px; }
  .exit-actions { display: flex; gap: 10px; }
  .exit-actions button { flex: 1; height: 48px; border: none; border-radius: 10px; font-size: 14px; font-weight: 800; letter-spacing: 1.5px; cursor: pointer; transition: transform .08s, filter .15s; }
  .exit-actions button:active { transform: scale(.96); }
  #exitCancel { background: linear-gradient(180deg, #3a4554, #1e2530); color: #fff; }
  #exitConfirm { background: linear-gradient(180deg, #ff6b35, #c42a1a); color: #fff; box-shadow: 0 4px 12px rgba(196,42,26,.4); }
  #pcHint { position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,.35); font-size: 11px; letter-spacing: 1px; z-index: 15; pointer-events: none; text-align: center; font-family: monospace; transition: opacity .5s; }
  #pcHint.fade { opacity: 0; }

  #fuseTimer {
    position: fixed; left: 50%; top: 58%; transform: translateX(-50%);
    color: #ffaa44; font-size: 22px; font-weight: 900; letter-spacing: 2px;
    font-family: 'Arial Black', sans-serif;
    text-shadow: 0 0 10px rgba(0,0,0,.9), 0 0 6px rgba(255,120,40,.7);
    pointer-events: none; z-index: 16; display: none;
  }
  #fuseTimer.visible { display: block; }
  #fuseTimer.danger { color: #ff2222; animation: fuseBlink .3s infinite; }
  @keyframes fuseBlink { 50% { opacity: 0.35; } }
</style>
</head>
<body>

<div id="mainMenu">
  <div class="mm-title">GRENADE ARENA</div>
  <div class="mm-subtitle">P2P · до 5 игроков</div>
  <div class="mm-nick">
    <label>ТВОЙ НИК</label>
    <input id="nickInput" type="text" maxlength="16" value="Player" placeholder="Player" autocomplete="off" spellcheck="false">
  </div>
  <div class="mm-nick">
    <label>КОД КОМНАТЫ (если есть)</label>
    <input id="roomCodeInput" type="text" maxlength="6" placeholder="XXXX" autocomplete="off" spellcheck="false">
  </div>
  <button id="playBtn">ВОЙТИ / БЫСТРАЯ</button>
  <button id="createBtn">+ СОЗДАТЬ КОМНАТУ</button>
  <button id="soloBtn">В СОЛО</button>
  <div id="menuStatus"></div>
  <div class="mm-footer">Создай комнату, передай код другу, он вводит код и жмёт ВОЙТИ</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<div id="statPanel">
  <span id="fpsText">60 FPS</span>
  <span class="stat-divider">·</span>
  <span id="pingText">— MS</span>
</div>

<div id="killFeed"></div>

<div id="tabBtn">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="7.5" r="3.4"/>
    <path d="M3 19c0-3.4 2.7-6 6-6s6 2.6 6 6"/>
    <circle cx="17.5" cy="8.5" r="2.4"/>
    <path d="M15 19c0-2.2 1.5-4 3.4-4 .9 0 1.6.3 2.1.7"/>
  </svg>
  <span id="tabBadge">1</span>
</div>

<div id="exitBtn">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 11l9-8 9 8"/>
    <path d="M5 10v10a1 1 0 001 1h3v-6h6v6h3a1 1 0 001-1V10"/>
  </svg>
</div>

<div id="playerListOverlay"></div>
<div id="playerList">
  <div class="pl-header">ИГРОКИ</div>
  <div id="playerListContent"></div>
  <div class="pl-room" id="roomInfo">—</div>
</div>
<div id="spectatorInfo"></div>

<div id="deathPanel">

function resolveWalls(pos, radius) {
  for (const w of walls) {
    if (pos.y >= w.height - 0.1) continue;
    if (pos.y + 1.7 < w.yBase) continue;
    const cx = Math.max(w.minX, Math.min(pos.x, w.maxX));
    const cz = Math.max(w.minZ, Math.min(pos.z, w.maxZ));
    const dx = pos.x - cx, dz = pos.z - cz;
    const d2 = dx*dx + dz*dz;
    if (d2 < radius*radius) {
      if (d2 > 0.0001) {
        const d = Math.sqrt(d2);
        pos.x += (dx/d) * (radius - d); pos.z += (dz/d) * (radius - d);
      } else {
        const pL = pos.x - w.minX, pR = w.maxX - pos.x;
        const pN = pos.z - w.minZ, pS = w.maxZ - pos.z;
        const m = Math.min(pL, pR, pN, pS);
        if (m === pL) pos.x = w.minX - radius;
        else if (m === pR) pos.x = w.maxX + radius;

const G_H = 0.26, G_R = 0.088;
const radAt = t => G_R * Math.pow(Math.sin(Math.PI * t), 0.6) * (1 - 0.28 * t);

function createGrenade() {
  const g = new THREE.Group();
  const prof = [];
  for (let i = 0; i <= 32; i++) { const t = i / 32; prof.push(new THREE.Vector2(Math.max(radAt(t), 0.0006), -G_H/2 + t*G_H)); }
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x62733a, roughness: 0.5, metalness: 0.45, emissive: 0x000000 });
  const body = new THREE.Mesh(new THREE.LatheGeometry(prof, 34), bodyMat);
  body.castShadow = true; g.add(body);
  const ribMat = new THREE.MeshStandardMaterial({ color:0x39441f, roughness:0.6, metalness:0.5 });
  for (const y of [-0.062, -0.021, 0.021, 0.062]) {
    const t = (y + G_H/2) / G_H; const tr = radAt(t);
    if (tr < 0.022) continue;
    const rib = new THREE.Mesh(new THREE.TorusGeometry(tr, 0.0055, 6, 28), ribMat);
    rib.rotation.x = Math.PI / 2; rib.position.y = y; g.add(rib);
  }
  const metalMat = new THREE.MeshStandardMaterial({ color:0x9aa3ad, roughness:0.32, metalness:0.95 });
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.033, 0.05, 18), metalMat);
  cap.position.y = G_H/2 + 0.014; cap.castShadow = true; g.add(cap);
  const lever = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.088, 0.022), metalMat);
  lever.position.set(0.031, G_H/2 + 0.022, 0); lever.rotation.z = 0.34; g.add(lever);
  const pin = new THREE.Mesh(new THREE.TorusGeometry(0.023, 0.005, 8, 20), metalMat);
  pin.position.set(-0.036, G_H/2 + 0.024, 0); pin.rotation.y = Math.PI / 2; g.add(pin);
  g.userData.bodyMat = bodyMat;
  return g;
}

function makePistolTextures() {

function updatePlayer(dt) {
  if (!gameStarted) {
    camera.position.set(player.pos.x, player.pos.y + player.height, player.pos.z);
    camera.rotation.set(player.pitch, player.yaw, 0);
    return;
  }
  if (isDead) {
    deathTimer -= dt;
    if (deathTimer <= 0) { doRespawn(); return; }
    const target = spectateTarget ? remotePlayers.get(spectateTarget) : null;
    if (target && target.visible) {
      const tp = target.position; const ang = target.rotation.y;
      const desired = new THREE.Vector3(tp.x + Math.sin(ang) * 3.2, tp.y + 2.6, tp.z + Math.cos(ang) * 3.2);
      camera.position.lerp(desired, 1 - Math.exp(-8 * dt));
      camera.lookAt(tp.x, tp.y + 1.2, tp.z);
    } else {
      camera.position.set(player.pos.x, player.pos.y + 5, player.pos.z);
      camera.lookAt(player.pos.x, player.pos.y, player.pos.z);
    }
    return;
  }
  const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

  wish.addScaledVector(forward, joy.y); wish.addScaledVector(right, joy.x);
  const len = wish.length(); if (len > 1) wish.divideScalar(len);

  if (!isGrounded) {
    playerVY -= PLAYER_GRAVITY * dt; player.pos.y += playerVY * dt;
    if (player.pos.y <= 0) { player.pos.y = 0; playerVY = 0; isGrounded = true; }
  } else player.pos.y = 0;
  resolveWalls(player.pos, PLAYER_RADIUS);
  player.pos.x = clamp(player.pos.x, -24.3, 24.3);
  player.pos.z = clamp(player.pos.z, -24.3, 24.3);

}

  const swayY = Math.sin(bobT * 2) * 0.010 * moving;

    else if (t < 0.80) { const p = (t - 0.50) / 0.30; const e = 1 - (1 - p) * (1 - p); magDropDist = 0.20 * (1 - e); magVisible = true; }
    else if (t < 0.90) { const p = (t - 0.80) / 0.10; magDropDist = -Math.sin(p * Math.PI) * 0.03; magVisible = true; }
    else { magDropDist = 0; magVisible = true; }
    if (reloadTimer <= 0) finishReload();
  }

  const targetLift = grenadeHolding ? 1 : 0;
  grenadeHoldLift += (targetLift - grenadeHoldLift) * Math.min(1, dt * 12);

  if (currentWeapon === 'pistol') {
    pistolGroup.position.set(
      WEAPON_POS_X + swayX - reloadTilt * 0.05,
      WEAPON_POS_Y + swayY + rk * 0.035 + reloadTilt * 0.11,
      WEAPON_POS_Z + rk * 0.08 + reloadTilt * 0.02
    );
    pistolGroup.rotation.set(
      0.03 + rk * 0.22 + reloadTilt * 0.18,
      PISTOL_YAW - reloadTilt * (PISTOL_YAW - 0.02),
      reloadTilt * 0.16
    );
    const mag = proceduralPistol.userData.magazine;
    if (mag) {
      const home = proceduralPistol.userData.magazineHome;
      const sA = Math.sin(0.2), cA = Math.cos(0.2);
      mag.position.set(home.x + sA * magDropDist + magDropDist * 0.32, home.y - cA * magDropDist, home.z);
      mag.visible = magVisible;
    }
  } else if (currentWeapon === 'knife') {
    updateKnifeAnim(dt);
    if (knifeAnimT < 0) {
      knifeGroup.position.set(KNIFE_IDLE_POS.x + swayX, KNIFE_IDLE_POS.y + swayY, KNIFE_IDLE_POS.z);
      knifeGroup.rotation.copy(KNIFE_IDLE_ROT);
    }
  } else if (currentWeapon === 'grenade') {
    const lift = grenadeHoldLift;
    const liftY = lift * 0.14;
    const liftZ = lift * 0.06;
    const liftPitch = lift * 0.30;
    heldGrenadeGroup.position.set(
      WEAPON_POS_X + swayX - lift * 0.02,
      WEAPON_POS_Y + swayY + liftY - punch * 0.20,
      WEAPON_POS_Z - punch * 0.20 + liftZ
    );
    heldGrenadeGroup.rotation.set(
      0.12 - punch * 0.55 - liftPitch,
      0.5 - lift * 0.15,
      -0.22 + lift * 0.10
    );
    if (held) {
      heldGrow = Math.min(1, heldGrow + dt * 5.5);
      const c1 = 1.70158, c3 = c1 + 1;
      const e = 1 + c3 * Math.pow(heldGrow - 1, 3) + c1 * Math.pow(heldGrow - 1, 2);
      held.scale.setScalar(GRENADE_SCALE * e);
      const mat = held.userData.bodyMat;
      if (mat) {
        if (grenadeHolding) {
          const remaining = Math.max(0, FUSE - grenadeHoldTime);
          if (remaining < 1.3) { const blink = Math.sin(remaining * 42) * 0.5 + 0.5; mat.emissive.setRGB(blink * 0.9, 0, 0); }
          else mat.emissive.setRGB(0, 0, 0);
        } else mat.emissive.setRGB(0, 0, 0);
      }
    }
  }
}

function updateEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) { if (effects[i](dt) === false) effects.splice(i, 1); }
}

function updatePing(dt) {
  if (!gameStarted || connections.length === 0) return;
  pingTimer -= dt;
  if (pingTimer <= 0) {
    pingTimer = 1.5; pingSeq++;
    const seq = pingSeq;
    pendingPings.set(seq, performance.now());
    sendToAll({ type: 'ping', seq });
    const s = seq;
    setTimeout(() => { if (pendingPings.has(s)) pendingPings.delete(s); }, 4000);
  }
}
function handlePingMsg(conn, data) { try { conn.send({ type: 'pong', seq: data.seq }); } catch(e) {} }
function handlePongMsg(conn, data) {
  const sentTs = pendingPings.get(data.seq);
  if (sentTs !== undefined) {
    const rtt = performance.now() - sentTs;
    pings.push(rtt);
    if (pings.length > 6) pings.shift();
    pendingPings.delete(data.seq);
    measuredPing = Math.round(pings.reduce((a,b)=>a+b,0) / pings.length);
  }
}

function applyPlayerSnapshot(pd) {
  if (pd.from === myId) return;
  if (pd.name) peerNames.set(pd.from, pd.name);
  let rp = remotePlayers.get(pd.from);
  if (!rp) {
    rp = createRemotePlayer(pd.from);
    remotePlayers.set(pd.from, rp);
    if (pd.name) setPlayerName(rp, pd.name);
    updateBadge();
  }
  rp.visible = true;
  rp.position.set(pd.pos[0], pd.pos[1], pd.pos[2]);
  rp.rotation.y = pd.yaw || 0;
  if (pd.name && peerNames.get(pd.from) !== pd.name) {
    peerNames.set(pd.from, pd.name);
    setPlayerName(rp, pd.name);
  }
}

function handleNetworkData(conn, data) {
  if (!data || !data.type) return;
  switch (data.type) {
    case 'ping': handlePingMsg(conn, data); break;
    case 'pong': handlePongMsg(conn, data); break;
    case 'state':
      if (data.from === myId || deadPeers.has(data.from)) break;
      applyPlayerSnapshot(data);
      if (playerListOpen) updatePlayerList();
      break;
    case 'shoot': {
      if (!data.pos) break;
      const pos = new THREE.Vector3().fromArray(data.pos);
      const dist = player.pos.distanceTo(pos);
      const vol = Math.max(0.08, Math.min(1.0, 1 - dist / 35));
      playShootSound(vol * 0.75);
      spawnMuzzleFlash(pos);
      if (data.dir) {
        const dir = new THREE.Vector3().fromArray(data.dir);
        const end = pos.clone().addScaledVector(dir, 40);
        const geo = new THREE.BufferGeometry().setFromPoints([pos, end]);
        const mat = new THREE.LineBasicMaterial({ color: 0xffee88, transparent: true, opacity: 0.7 });
        const line = new THREE.Line(geo, mat); scene.add(line);
        let t = 0;
        effects.push(dt => {
          t += dt;
          if (t > 0.08) { scene.remove(line); geo.dispose(); mat.dispose(); return false; }
          mat.opacity = 0.7 * (1 - t / 0.08);
        });
      }
      break;
    }
    case 'grenade': {
      if (!data.pos || !data.vel) break;
      if (data.name && data.from) peerNames.set(data.from, data.name);
      const pos = new THREE.Vector3().fromArray(data.pos);
      const vel = new THREE.Vector3().fromArray(data.vel);
      const g = createGrenade(); g.position.copy(pos); scene.add(g);
      let fuse = data.fuse !== undefined ? data.fuse : FUSE;
      effects.push(dt => {
        fuse -= dt; vel.y -= GRAVITY * dt;
        g.position.addScaledVector(vel, dt);
        g.rotation.x += 3 * dt; g.rotation.y += 4 * dt;
        grenadeWallCollide(g.position, vel, 0.11);
        if (g.position.y < 0.11) {
          g.position.y = 0.11;
          if (vel.y < -0.6) { vel.y *= -0.4; vel.x *= 0.72; vel.z *= 0.72; }
          else { vel.y = 0; const fr = Math.max(0, 1 - 3.2*dt); vel.x *= fr; vel.z *= fr; }
        }
        if (fuse <= 0) { const p = g.position.clone(); scene.remove(g); disposeGroup(g); explode(p); return false; }
        return true;
      });
      break;
    }
    case 'damaged':
      if (data.target === myId) applyDamageToSelf(data.amount, data.from, data.weapon);
      break;
    case 'died': {
      if (data.victim === myId) break;
      if (deadPeers.has(data.victim)) break;
      deadPeers.add(data.victim);
      addKillFeed(data.killerName || 'Неизвестно', data.victimName || 'Неизвестно', data.weapon);
      if (data.killer === myId && data.victim !== myId) playKillSound();
      const rp = remotePlayers.get(data.victim);
      if (rp) rp.visible = false;
      if (playerListOpen) updatePlayerList();
      break;
    }
    case 'respawned':
      if (data.from === myId) break;
      deadPeers.delete(data.from);
      const rp2 = remotePlayers.get(data.from);
      if (rp2) rp2.visible = true;
      if (playerListOpen) updatePlayerList();
      break;
  }
}

function setupConnHandlers(conn) {
  conn.on('data', (data) => {
    handleNetworkData(conn, data);
    if (isHost && data && data.type && data.type !== 'ping' && data.type !== 'pong') relayToOthers(conn, data);
  });
  conn.on('close', () => {
    const idx = connections.indexOf(conn);
    if (idx >= 0) connections.splice(idx, 1);
    if (!isHost && gameStarted) { returnToMenu('Хост покинул игру'); return; }
    const rp = remotePlayers.get(conn.peer);
    if (rp) { scene.remove(rp); disposeGroup(rp); remotePlayers.delete(conn.peer); }
    deadPeers.delete(conn.peer); peerNames.delete(conn.peer);
    updateBadge();
    if (playerListOpen) updatePlayerList();
  });
  conn.on('error', () => {});
}

function setupAsHost() {
  if (hostHandlerBound) return;
  hostHandlerBound = true;
  peer.on('connection', (conn) => {
    conn.on('open', () => {
      if (connections.length >= MAX_PLAYERS - 1) {
        try { conn.send({ type: 'full' }); } catch(e) {}
        setTimeout(() => { try { conn.close(); } catch(e) {} }, 200);
        return;
      }
      const players = [];
      players.push({ from: myId, name: myName, pos: player.pos.toArray(), yaw: player.yaw });
      for (const [peerId, rp] of remotePlayers) {
        players.push({ from: peerId, name: peerNames.get(peerId) || 'Игрок', pos: rp.position.toArray(), yaw: rp.rotation.y });
      }
      try { conn.send({ type: 'joined', players }); } catch(e) {}
      connections.push(conn);
      setupConnHandlers(conn);
      try { conn.send({ type: 'state', from: myId, name: myName, pos: player.pos.toArray(), yaw: player.yaw, pitch: player.pitch }); } catch(e) {}
    });
  });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch(e) {} });
  peer.on('error', (err) => { if (err.type !== 'peer-unavailable') console.warn('Host error:', err.type); });
}

/* === Стать хостом с конкретным ID === */
async function tryHost(roomId, timeout = 6000) {
  return new Promise((resolve) => {
    let done = false; let p;
    try { p = new Peer(roomId, PEER_CONFIG); } catch(e) { resolve({ ok: false, reason: 'error', err: e }); return; }
    const finish = (r) => {
      if (done) return; done = true;
      if (!r.ok && r.reason !== 'hosted') { try { p.destroy(); } catch(e) {} }
      resolve(r);
    };
    p.on('open', () => {
      peer = p; isHost = true; myId = roomId;
      hostHandlerBound = false;
      setupAsHost();
      finish({ ok: true, reason: 'hosted' });
    });
    p.on('error', (err) => {
      if (err.type === 'unavailable-id') finish({ ok: false, reason: 'taken' });
      else finish({ ok: false, reason: 'error', err });
    });
    setTimeout(() => finish({ ok: false, reason: 'timeout' }), timeout);
  });
}

/* === Подключиться к существующему ID === */
async function tryJoin(roomId, timeout = 10000) {
  return new Promise((resolve) => {
    let done = false; let p;
    try { p = new Peer(null, PEER_CONFIG); } catch(e) { resolve({ ok: false, reason: 'error', err: e }); return; }
    const finish = (r) => {
      if (done) return; done = true;
      if (!r.ok) { try { p.destroy(); } catch(e) {} }
      resolve(r);
    };
    p.on('open', () => {
      try {
        const conn = p.connect(roomId, { reliable: true });
        conn.on('open', () => {});
        conn.on('data', (data) => {
          if (data.type === 'joined') {
            peer = p; isHost = false; myId = p.id;
            connections.push(conn);
            setupConnHandlers(conn);
            p.on('disconnected', () => { try { p.reconnect(); } catch(e) {} });
            p.on('error', (err) => { if (err.type !== 'peer-unavailable') console.warn('Client error:', err.type); });
            if (data.players && Array.isArray(data.players)) { for (const pd of data.players) applyPlayerSnapshot(pd); }
            updateBadge();
            try { conn.send({ type: 'state', from: myId, name: myName, pos: player.pos.toArray(), yaw: player.yaw, pitch: player.pitch }); } catch(e) {}
            finish({ ok: true, reason: 'joined' });
          } else if (data.type === 'full') finish({ ok: false, reason: 'full' });
        });
        conn.on('close', () => finish({ ok: false, reason: 'closed' }));
        conn.on('error', () => finish({ ok: false, reason: 'error' }));
      } catch(e) { finish({ ok: false, reason: 'error', err: e }); }
    });
    p.on('error', (err) => {
      if (err.type === 'peer-unavailable') finish({ ok: false, reason: 'unavailable' });
      else finish({ ok: false, reason: 'error', err });
    });
    setTimeout(() => finish({ ok: false, reason: 'timeout' }), timeout);
  });
}

/* === Войти по коду (создать если нет) === */
async function startWithCode(code) {
  code = code.toUpperCase().trim();
  if (!/^[A-Z0-9]{2,6}$/.test(code)) {
    setMenuStatus('Код должен быть 2-6 символов (A-Z, 0-9)', 'err');
    return;
  }
  playBtn.disabled = true; createBtn.disabled = true; soloBtn.disabled = true;
  const roomId = ROOM_PREFIX + code;

  // 1) пробуем присоединиться (если кто-то уже хостит)
  setMenuStatus(`Подключение к ${code}...`);
  const joinRes = await tryJoin(roomId, 10000);
  if (joinRes.ok) {
    setMenuStatus('Подключено!', 'ok');
    setTimeout(() => launchGame(roomId), 200);
    return;
  }

  // 2) если комната пуста (unavailable/taken) — становимся хостом с этим кодом
  if (joinRes.reason === 'unavailable' || joinRes.reason === 'timeout' || joinRes.reason === 'taken') {
    setMenuStatus(`Создание комнаты ${code}...`);
    const hostRes = await tryHost(roomId, 6000);
    if (hostRes.ok) {
      setMenuStatus(`Комната ${code} создана. Передайте код другу!`, 'code');
      setTimeout(() => launchGame(roomId), 200);
      return;
    }
    if (hostRes.reason === 'taken') {
      setMenuStatus(`Комната ${code} занята, но недоступна. Попробуйте другой код`, 'err');
    } else {
      setMenuStatus(`Сервер не отвечает (${hostRes.reason}). Попробуйте позже`, 'err');
    }
  } else if (joinRes.reason === 'full') {
    setMenuStatus('Комната заполнена (макс. 5 игроков)', 'err');
  } else if (joinRes.reason === 'closed') {
    setMenuStatus('Хост закрыл комнату', 'err');
  } else {
    setMenuStatus('Сервер не отвечает. Попробуйте ещё раз', 'err');
  }

  playBtn.disabled = false; createBtn.disabled = false; soloBtn.disabled = false;
}

/* === Создать комнату с новым кодом === */
async function createNewRoom() {
  playBtn.disabled = true; createBtn.disabled = true; soloBtn.disabled = true;

  for (let attempt = 0; attempt < 5; attempt++) {
    const code = genRoomCode();
    const roomId = ROOM_PREFIX + code;
    setMenuStatus(`Создание комнаты ${code}...`);

    const hostRes = await tryHost(roomId, 6000);
    if (hostRes.ok) {
      roomCodeInput.value = code;
      setMenuStatus(`КОД: ${code}  —  передайте другу!`, 'code');
      setTimeout(() => launchGame(roomId), 300);
      return;
    }
    if (hostRes.reason === 'timeout') {
      setMenuStatus('Сервер PeerJS не отвечает. Проверьте интернет', 'err');
      playBtn.disabled = false; createBtn.disabled = false; soloBtn.disabled = false;
      return;
    }
    // taken — генерируем новый код
  }
  setMenuStatus('Не удалось создать комнату. Попробуйте ещё раз', 'err');
  playBtn.disabled = false; createBtn.disabled = false; soloBtn.disabled = false;
}

/* === Быстрая игра (перебор короткого набора комнат) === */
async function quickPlay() {
  playBtn.disabled = true; createBtn.disabled = true; soloBtn.disabled = true;

  for (let r = 1; r <= MAX_ROOMS; r++) {
    const code = 'QUICK' + r; // короткие, стабильные коды
    const roomId = ROOM_PREFIX + code;
    setMenuStatus(`Поиск (${r}/${MAX_ROOMS})...`);

    // Сначала пробуем стать хостом — если свободно, стартуем
    const hostRes = await tryHost(roomId, 6000);
    if (hostRes.ok) {
      setMenuStatus(`Комната найдена: ${code}`, 'ok');
      setTimeout(() => launchGame(roomId), 200);
      return;
    }
    if (hostRes.reason === 'taken') {
      // Кто-то уже хостит — подключаемся
      setMenuStatus(`Подключение к ${code}...`);
      const joinRes = await tryJoin(roomId, 10000);
      if (joinRes.ok) {
        setMenuStatus('Подключено!', 'ok');
        setTimeout(() => launchGame(roomId), 200);
        return;
      }
      if (joinRes.reason === 'full') {
        setMenuStatus(`Комната ${r} заполнена`, '');
        continue;
      }
      // Комната занята, но подключиться не удалось — идём в следующую
      continue;
    }
    if (hostRes.reason === 'timeout') {
      // Сервер вообще не отвечает — нет смысла перебирать дальше
      setMenuStatus('Сервер PeerJS не отвечает. Используйте «Создать комнату» с кодом', 'err');
      playBtn.disabled = false; createBtn.disabled = false; soloBtn.disabled = false;
      return;
    }
  }
  setMenuStatus('Все комнаты заняты. Создайте свою!', 'err');
  playBtn.disabled = false; createBtn.disabled = false; soloBtn.disabled = false;
}

function updateJoyIndicator() {
  if (!gameStarted || isDead) { joyBaseEl.classList.remove('active'); return; }
  const mag = Math.hypot(joy.x, joy.y);
  if (mag > 0.01) {
    joyBaseEl.classList.add('active');

  }
}

window.addEventListener('keydown', e => {
  if (!gameStarted) return;
  if (e.code === 'Tab') { e.preventDefault(); setPlayerListOpen(true); return; }
  if (e.code === 'Escape') {
    if (!exitModal.classList.contains('visible')) {
      exitModal.classList.add('visible');
      if (document.pointerLockElement) { intentionalUnlock = true; document.exitPointerLock(); }
    }
    return;
  }
  if (e.code === 'Space') { e.preventDefault(); jump(); return; }
  if (e.code === 'KeyR') { e.preventDefault(); startReload(); return; }
  if (e.code === 'KeyG') {
    e.preventDefault();
    if (currentWeapon === 'grenade') throwGrenade();
    else if (grenadesLeft > 0) { selectWeapon('grenade'); throwGrenade(); }
    return;
  }
  if (e.code === 'Digit1') selectWeapon('pistol');
  if (e.code === 'Digit2') selectWeapon('knife');
  if (e.code === 'Digit3') selectWeapon('grenade');
  keys[e.code] = true;
});
window.addEventListener('keyup', e => {
  if (!gameStarted) return;
  if (e.code === 'Tab') { e.preventDefault(); setPlayerListOpen(false); return; }
  keys[e.code] = false;
});

function keyboardMove() {
  if (!gameStarted || isDead) { joy.x = 0; joy.y = 0; return; }
  let kx = 0, ky = 0;
  if (keys['KeyW'] || keys['ArrowUp']) ky += 1;
  if (keys['KeyS'] || keys['ArrowDown']) ky -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) kx += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) kx -= 1;
  if (kx || ky) { const l = Math.hypot(kx, ky); joy.x = kx/l; joy.y = ky/l; }
  else { joy.x = 0; joy.y = 0; }
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

const clock = new THREE.Clock();
let playerListTick = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime;

  fpsFrames++; fpsTimer += dt;
  if (fpsTimer >= 0.5) { currentFPS = Math.round(fpsFrames / fpsTimer); fpsFrames = 0; fpsTimer = 0; }
  statsUpdateTimer += dt;
  if (statsUpdateTimer >= 0.5) { statsUpdateTimer = 0; updateStatsUI(); }

  if (fireTimer > 0) fireTimer -= dt;
  if (firingHeld && currentWeapon === 'pistol' && !isReloading && ammoInMag > 0 && !isDead && pointerLocked) shoot();
  keyboardMove();
  updateJoyIndicator();
  updatePlayer(dt);
  updateWeapon(dt);
  updateGrenade(dt);
  updateEffects(dt);
  updateNetwork(dt);
  updatePing(dt);
  if (currentTheme === 'dark') updateTorches(elapsed);

  if (grenadeHolding) {
    grenadeHoldTime += dt;
    const remaining = Math.max(0, FUSE - grenadeHoldTime);
    fuseTimerEl.textContent = remaining.toFixed(1) + 's';
    fuseTimerEl.classList.add('visible');
    fuseTimerEl.classList.toggle('danger', remaining < 1.3);
    if (remaining < 1.3) {
      fuseBeepTimer -= dt;
      if (fuseBeepTimer <= 0) {
        const t = Math.max(0.12, remaining / 1.3);
        playFuseBeep(0.9);
        fuseBeepTimer = 0.12 + t * 0.3;
      }
    }
    if (grenadeHoldTime >= FUSE) {
      grenadeHolding = false; grenadeHoldTime = 0;
      fuseTimerEl.classList.remove('visible', 'danger');
      explodeGrenadeInHand();
    }
  } else {
    fuseTimerEl.classList.remove('visible', 'danger');
  }

  if (gameStarted && !isDead && moving > 0.25 && isGrounded) {
    footstepTimer -= dt;
    if (footstepTimer <= 0) {
      playFootstepSound(0.9);
      footstepTimer = 0.36 - moving * 0.06 + Math.random() * 0.04;
    }
  } else {
    footstepTimer = 0;
  }

  if (isDead) {
    const specTimer = document.getElementById('specTimer');
    if (specTimer) specTimer.textContent = Math.ceil(deathTimer);
  }
  playerListTick += dt;
  if (playerListTick > 1 && playerListOpen) { playerListTick = 0; updatePlayerList(); }

  if (shake > 0) {
    shake = Math.max(0, shake - dt * 2.4);
    const s = shake * shake * 0.22;
    camera.position.x += (Math.random() - 0.5) * s;
    camera.position.y += (Math.random() - 0.5) * s;
    camera.position.z += (Math.random() - 0.5) * s;
    camera.rotation.z = (Math.random() - 0.5) * s * 0.35;
  } else camera.rotation.z = 0;
  if (flashAmt > 0) {
    flashAmt = Math.max(0, flashAmt - dt * 2.6);
    flashEl.style.opacity = flashAmt;
  } else if (flashEl.style.opacity !== '0') flashEl.style.opacity = '0';
  sun.position.set(player.pos.x + 26, 42, player.pos.z + 18);
  sun.target.position.set(player.pos.x, 0, player.pos.z);
  sun.target.updateMatrixWorld();
  renderer.render(scene, camera);
}

document.addEventListener('click', initAudio, { once: true });
document.addEventListener('keydown', initAudio, { once: true });

selectWeapon('pistol');
updateHPUI();
updateAmmoUI();
updateBadge();
updateStatsUI();
animate();
</script>
</body>
